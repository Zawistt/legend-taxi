<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Legend Kombat — Arena</title>
<style>
  html,body{margin:0;height:100%;background:#0a0610;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  .btn{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));min-width:74px;height:74px;border-radius:50%;
       border:2px solid #ffd79a66;background:radial-gradient(circle at 35% 30%,#ffb35a33,#1a0c1ecc);color:#ffe6bf;
       font:600 15px Georgia,serif;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  .btn:active,.btn.on{background:radial-gradient(circle at 35% 30%,#ffb35aaa,#6d1220cc)}
  #l{left:16px}#r{left:104px}#j{right:16px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 84px)}
  #p{right:100px}#k{right:16px}
  #h{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#ffe6bfcc;font:13px Georgia,serif;
     text-shadow:0 1px 4px #000;white-space:nowrap;pointer-events:none;animation:fade 1s 8s forwards}
  #t{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
     color:#ffe9c4;font-family:Georgia,'Times New Roman',serif;text-align:center;opacity:0;animation:title 7s ease forwards}
  #t b{font-size:min(9vw,76px);letter-spacing:.28em;font-weight:700;text-shadow:0 0 28px #ff7a2a,0 0 60px #b3202a,0 3px 8px #000}
  #t i{margin-top:10px;font-size:min(3.2vw,18px);letter-spacing:.5em;opacity:.8;text-shadow:0 2px 6px #000}
  @keyframes title{0%{opacity:0;transform:scale(1.08)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.98)}}
  @keyframes fade{to{opacity:0}}
  @media (hover:hover) and (pointer:fine){.btn{display:none}}
</style>

<body>
<canvas id="c"></canvas>
<div id="t"><b>LEGEND KOMBAT</b><i>ARENA</i></div>
<div id="h">A/D yoki ←/→ — yurish · W/Space — sakrash · J — zarba · K — tepki</div>
<div class="btn" id="l">◀</div><div class="btn" id="r">▶</div>
<div class="btn" id="j">▲</div><div class="btn" id="p">Zarba</div><div class="btn" id="k">Tepki</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'), g=cv.getContext('2d');
var BASE_WORLD=300, WW=BASE_WORLD;          // dunyo kengligi (birlik; ekran balandligi = 100)
var W,H,u,V;                                // piksel kenglik/balandlik, 1 birlik = u piksel, ekran kengligi birlikda
var T=0, cam=0, camFollow=0, introT=0;
var L={}, SP={};                            // qatlamlar va spritelar
var FY0=74, FY1=100, FEET=91;               // pol: orqa chet, old chet, qahramon oyoq chizig'i
var SPEED=34;

/* ---------- yordamchilar ---------- */
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function fper(y){return 0.55+0.45*(y-FY0)/(FEET-FY0);}      // pol perspektivasi
function projX(wx,y){var cc=cam+V/2;return V/2+(wx-cc)*fper(y);}

/* ---------- o'lchamni sozlash ---------- */
function resize(){
  var cw=innerWidth,ch=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  var sc=Math.min(dpr,1000/ch);
  W=cv.width=Math.round(cw*sc);H=cv.height=Math.round(ch*sc);
  u=H/100;V=W/u;WW=Math.max(BASE_WORLD,V+40);
  build();
}
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,120);});

function makeLayer(par,fn,seed){
  var lw=V+(WW-V)*par, c=mk(lw*u,H), x=c.getContext('2d');
  x.scale(c.width/lw,H/100);
  var o={cv:c,par:par,w:lw,falls:[],ctx:x};
  fn(x,lw,rng(seed),o);
  return o;
}

/* =====================  QURILISH  ===================== */
function karst(x,cx,base,w,h,r,c){
  var n=24,Lp=[],Rp=[],i,s;
  for(i=0;i<=n;i++){
    s=i/n;
    var hw=w/2*(1-0.62*Math.pow(s,0.75))*(1+0.1*Math.sin(s*7+r()*2));
    var y=base-h*s;
    Lp.push([cx-hw*(1+(r()-.5)*.14),y]);Rp.push([cx+hw*(1+(r()-.5)*.14),y]);
  }
  x.beginPath();x.moveTo(Lp[0][0],base+40);
  for(i=0;i<=n;i++)x.lineTo(Lp[i][0],Lp[i][1]);
  x.lineTo(cx-w*.02,base-h-w*.035);x.lineTo(cx+w*.03,base-h-w*.03);
  for(i=n;i>=0;i--)x.lineTo(Rp[i][0],Rp[i][1]);
  x.lineTo(Rp[0][0],base+40);x.closePath();
  var gr=x.createLinearGradient(cx-w/2,0,cx+w/2,0);
  gr.addColorStop(0,c.dark);gr.addColorStop(.55,c.mid);gr.addColorStop(1,c.lit);
  x.fillStyle=gr;x.fill();
  x.save();x.clip();
  var hz=x.createLinearGradient(0,base-h,0,base);
  hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(1,c.haze);
  x.fillStyle=hz;x.fillRect(cx-w,base-h-5,w*2,h+45);
  x.strokeStyle='rgba(10,5,25,.22)';x.lineWidth=.25;
  for(i=0;i<9;i++){
    var yy=base-h*(.08+r()*.85),xa=cx-w/2+r()*w*.3;
    x.beginPath();x.moveTo(xa,yy);x.lineTo(xa+w*(.2+r()*.4),yy+(r()-.35)*3);x.stroke();
  }
  x.restore();
  x.strokeStyle=c.rim;x.lineWidth=c.rimW||.3;x.beginPath();
  for(i=0;i<=n;i++){if(i===0)x.moveTo(Rp[i][0],Rp[i][1]);else x.lineTo(Rp[i][0],Rp[i][1]);}
  x.stroke();
  // daraxtlar (cho'qqi va tokchalarda)
  x.fillStyle=c.tree;
  for(i=0;i<7;i++){
    var tx=cx+(r()-.5)*w*.34,ty=base-h-w*.02+r()*1.2,tr=.55+r()*.9*(c.treeS||1);
    x.beginPath();x.arc(tx,ty,tr,0,6.3);x.fill();
    x.beginPath();x.moveTo(tx-tr*.7,ty);x.lineTo(tx,ty-tr*2.2);x.lineTo(tx+tr*.7,ty);x.fill();
  }
  return {Lp:Lp,Rp:Rp};
}
function hwAt(w,s){return w/2*(1-0.62*Math.pow(s,0.75));}

function pagoda(x,px,by,s,tiers,p){
  var w=7*s,h=3.1*s,y=by,i;
  x.fillStyle=p.wall;x.fillRect(px-w*.68,y-.9*s,w*1.36,.9*s);
  for(i=0;i<tiers;i++){
    var tw=w*(1-i*.15),bt=y-h-.9*s;
    x.fillStyle=p.wall;x.fillRect(px-tw*.42,bt,tw*.84,h);
    x.fillStyle=p.win;
    for(var k=-1;k<=1;k++)x.fillRect(px+k*tw*.24-.28*s,bt+.55*s,.56*s,1.5*s);
    var ry=bt,rw=tw*.8;
    x.fillStyle=p.roof;x.beginPath();
    x.moveTo(px-rw,ry-.7*s);
    x.quadraticCurveTo(px-rw*.55,ry+.15*s,px-rw*.28,ry-1.7*s);
    x.lineTo(px+rw*.28,ry-1.7*s);
    x.quadraticCurveTo(px+rw*.55,ry+.15*s,px+rw,ry-.7*s);
    x.quadraticCurveTo(px,ry+1.1*s,px-rw,ry-.7*s);x.closePath();x.fill();
    x.strokeStyle=p.rim;x.lineWidth=.2*s;x.beginPath();
    x.moveTo(px+rw*.28,ry-1.7*s);x.quadraticCurveTo(px+rw*.55,ry+.15*s,px+rw,ry-.7*s);x.stroke();
    x.fillStyle=p.win;x.beginPath();x.arc(px-rw,ry-.2*s,.3*s,0,6.3);x.fill();x.beginPath();x.arc(px+rw,ry-.2*s,.3*s,0,6.3);x.fill();
    y=ry-1.35*s;
  }
  x.strokeStyle=p.roof;x.lineWidth=.3*s;x.beginPath();x.moveTo(px,y);x.lineTo(px,y-2.6*s);x.stroke();
  x.fillStyle=p.rim;x.beginPath();x.arc(px,y-2.6*s,.35*s,0,6.3);x.fill();
}
function bridge(x,x1,x2,y,rise,th,p){
  var mx=(x1+x2)/2;
  x.fillStyle=p.wall;x.beginPath();x.moveTo(x1,y);x.quadraticCurveTo(mx,y-2*rise,x2,y);
  x.lineTo(x2,y+th);x.quadraticCurveTo(mx,y-2*rise+th*1.15,x1,y+th);x.closePath();x.fill();
  x.strokeStyle=p.rim;x.lineWidth=.22;x.beginPath();x.moveTo(x1,y);x.quadraticCurveTo(mx,y-2*rise,x2,y);x.stroke();
  x.strokeStyle=p.roof;x.lineWidth=.2;
  for(var i=0;i<=10;i++){var t=i/10,bx=(1-t)*(1-t)*x1+2*t*(1-t)*mx+t*t*x2,by=(1-t)*(1-t)*y+2*t*(1-t)*(y-2*rise)+t*t*y;
    x.beginPath();x.moveTo(bx,by);x.lineTo(bx,by-1.1);x.stroke();}
  x.beginPath();x.moveTo(x1,y-1.1);x.quadraticCurveTo(mx,y-2*rise-1.1,x2,y-1.1);x.stroke();
  x.globalCompositeOperation='destination-out';x.beginPath();
  var a=x1+(x2-x1)*.16,b=x2-(x2-x1)*.16;
  x.moveTo(a,y+th*1.05);x.quadraticCurveTo((a+b)/2,y-2*rise+th*1.9,b,y+th*1.05);x.closePath();x.fill();
  x.globalCompositeOperation='source-over';
}
function maple(x,px,by,s,r){
  x.strokeStyle='#150a14';x.lineWidth=.55*s;x.lineCap='round';
  x.beginPath();x.moveTo(px,by);x.quadraticCurveTo(px+.7*s,by-3*s,px-.2*s,by-5.5*s);x.stroke();
  for(var i=0;i<9;i++){
    var cx=px+(r()-.5)*5*s,cy=by-5.5*s+(r()-.5)*3.2*s,rr=(1.5+r()*1.4)*s;
    var gr=x.createRadialGradient(cx+.4*s,cy-.4*s,0,cx,cy,rr);
    gr.addColorStop(0,'#ff6a34');gr.addColorStop(.55,'#c4202c');gr.addColorStop(1,'rgba(90,10,30,0)');
    x.fillStyle=gr;x.beginPath();x.arc(cx,cy,rr,0,6.3);x.fill();
  }
}
function mountainLayer(x,lw,r,o,opt){
  var cx=-6,pk=[];
  while(cx<lw+8){
    var w=lerp(opt.wMin,opt.wMax,r()),h=lerp(opt.hMin,opt.hMax,r());
    var c=cx+w/2,geo=karst(x,c,opt.base,w,h,r,opt.col);
    pk.push({c:c,w:w,h:h,geo:geo});
    if(opt.pagoda&&r()<opt.pp){
      pagoda(x,c+(r()-.5)*w*.1,opt.base-h-w*.03+.7,opt.ps*(.8+r()*.5),2+Math.floor(r()*3),opt.pal);
      if(opt.ps>1.2&&r()<.5)pagoda(x,c+w*.18,opt.base-h*.55,opt.ps*.55,2,opt.pal);
    }
    if(opt.fall&&r()<opt.wp){
      var fx=c+(r()-.5)*w*.22,fy=opt.base-h*(.33+r()*.3);
      x.fillStyle='rgba(8,4,20,.28)';x.fillRect(fx-opt.fw*.65,fy-.6,opt.fw*1.3,opt.base-fy+4);
      o.falls.push({x:fx,y0:fy,y1:opt.base+3,w:opt.fw*(.8+r()*.5)});
    }
    if(opt.maples&&r()<.7)maple(x,c+(r()-.5)*w*.4,opt.base-h*(.2+r()*.3),opt.ms,r);
    cx+=w*lerp(opt.gMin,opt.gMax,r());
  }
  for(var i=0;i<pk.length-1&&opt.bridges;i++){
    var A=pk[i],B=pk[i+1],hm=Math.min(A.h,B.h),yb=opt.base-hm*(.42+r()*.12);
    var sA=(opt.base-yb)/A.h,sB=(opt.base-yb)/B.h;
    var x1=A.c+hwAt(A.w,sA)-.8,x2=B.c-hwAt(B.w,sB)+.8;
    if(x2-x1>7&&x2-x1<46)bridge(x,x1,x2,yb,2.6+(x2-x1)*.06,1.3,opt.pal);
  }
  var fg=x.createLinearGradient(0,opt.base-30,0,opt.base+4);
  fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(1,opt.col.haze);
  x.fillStyle=fg;x.fillRect(0,opt.base-30,lw,40);
}

function drawSkyStatic(x,lw,r){
  var gr=x.createLinearGradient(0,0,0,100);
  gr.addColorStop(0,'#10112e');gr.addColorStop(.22,'#2c2160');gr.addColorStop(.42,'#8a3f78');
  gr.addColorStop(.58,'#ec6a4a');gr.addColorStop(.72,'#ffa655');gr.addColorStop(1,'#ffd08a');
  x.fillStyle=gr;x.fillRect(0,0,lw,100);
  for(var i=0;i<70;i++){
    x.fillStyle='rgba(255,240,230,'+(.15+r()*.45)+')';
    x.beginPath();x.arc(r()*lw,r()*22,.12+r()*.18,0,6.3);x.fill();
  }
}

function cloudSprite(seed,w,h){
  var r=rng(seed),PX=6,c=mk(w*PX,h*PX),x=c.getContext('2d');x.scale(PX,PX);
  var i;
  for(i=0;i<16;i++){
    var t=r(),cx=w*(.12+.76*t),cy=h*(.55-.22*Math.sin(t*3.14)*(.6+r()*.6))+(r()-.5)*h*.12,rr=h*(.28+r()*.3)*(1-Math.abs(t-.5)*.7);
    var gr=x.createRadialGradient(cx,cy,0,cx,cy,rr);
    gr.addColorStop(0,'rgba(120,70,130,.95)');gr.addColorStop(.6,'rgba(110,60,120,.6)');gr.addColorStop(1,'rgba(100,50,110,0)');
    x.fillStyle=gr;x.beginPath();x.arc(cx,cy,rr,0,6.3);x.fill();
  }
  x.globalCompositeOperation='source-atop';
  var v=x.createLinearGradient(0,0,0,h);
  v.addColorStop(0,'rgba(40,30,90,.65)');v.addColorStop(.45,'rgba(200,80,100,.45)');v.addColorStop(1,'rgba(255,190,100,.9)');
  x.fillStyle=v;x.fillRect(0,0,w,h);
  var hh=x.createLinearGradient(0,0,w,0);
  hh.addColorStop(0,'rgba(255,200,140,0)');hh.addColorStop(1,'rgba(255,220,160,.45)');
  x.fillStyle=hh;x.fillRect(0,0,w,h);
  return {cv:c,w:w,h:h};
}
function mistSprite(seed,tint){
  var r=rng(seed),c=mk(256,96),x=c.getContext('2d');
  for(var i=0;i<7;i++){
    var cx=30+r()*196,cy=34+r()*34,rr=26+r()*28;
    var gr=x.createRadialGradient(cx,cy,0,cx,cy,rr);
    gr.addColorStop(0,'rgba('+tint+',.85)');gr.addColorStop(.5,'rgba('+tint+',.4)');gr.addColorStop(1,'rgba('+tint+',0)');
    x.fillStyle=gr;x.fillRect(0,0,256,96);
  }
  return c;
}

/* ----- haykal (haykaltarosh) spriti ----- */
function statueSprite(flip){
  var SW=44,SH=72,PX=u,c=mk(SW*PX,SH*PX),x=c.getContext('2d');x.scale(PX,PX);
  x.translate(SW/2,SH);
  var br=x.createLinearGradient(-12,0,12,0);br.addColorStop(0,'#1a1410');br.addColorStop(.5,'#3a2c22');br.addColorStop(1,'#6a5038');
  var gold='#e0aa48',dk='#120c0b';
  x.save();if(flip)x.scale(-1,1);
  // plash
  x.fillStyle='#3a0a14';x.beginPath();x.moveTo(-8,-47);x.lineTo(8,-47);x.lineTo(13,-20);x.lineTo(-13,-20);x.closePath();x.fill();
  // postament
  x.fillStyle=br;x.fillRect(-13,-3,26,3);x.fillRect(-11.5,-6,23,3);x.fillRect(-10,-17,20,11);
  x.strokeStyle=gold;x.lineWidth=.3;x.strokeRect(-8.3,-15.3,16.6,8);
  x.beginPath();x.moveTo(0,-14.5);x.lineTo(2.2,-11.3);x.lineTo(0,-8.1);x.lineTo(-2.2,-11.3);x.closePath();x.stroke();
  // oyoqlar
  x.fillStyle=br;x.fillRect(-6,-27,4.8,10);x.fillRect(1.2,-27,4.8,10);
  x.fillStyle=dk;x.fillRect(-6.6,-19,6,2.2);x.fillRect(.6,-19,6,2.2);
  // yubka
  x.fillStyle=br;x.beginPath();x.moveTo(-7.5,-33);x.lineTo(7.5,-33);x.lineTo(9.2,-24);x.lineTo(-9.2,-24);x.closePath();x.fill();
  x.strokeStyle=gold;x.lineWidth=.25;x.beginPath();x.moveTo(-8.4,-28.5);x.lineTo(8.4,-28.5);x.stroke();
  // tana
  x.fillStyle=br;x.beginPath();x.moveTo(-7,-33);x.lineTo(7,-33);x.lineTo(8.6,-45);x.lineTo(5,-50);x.lineTo(-5,-50);x.lineTo(-8.6,-45);x.closePath();x.fill();
  x.strokeStyle=gold;x.lineWidth=.35;x.beginPath();x.moveTo(0,-50);x.lineTo(0,-33);x.moveTo(-5,-43);x.lineTo(5,-43);x.stroke();
  x.fillStyle=gold;x.fillRect(-7.2,-34.6,14.4,1.4);
  // yelkalar
  [-1,1].forEach(function(sd){
    x.fillStyle=br;x.beginPath();x.ellipse(sd*9.6,-47.5,4.8,3.3,0,0,6.3);x.fill();
    x.strokeStyle=gold;x.lineWidth=.3;x.stroke();
    x.fillStyle=dk;x.beginPath();x.moveTo(sd*7.4,-49.4);x.lineTo(sd*9.6,-54.5);x.lineTo(sd*11.8,-49.4);x.closePath();x.fill();
  });
  // nayza (chap)
  x.strokeStyle='#2b2018';x.lineWidth=.9;x.beginPath();x.moveTo(-15,-17);x.lineTo(-15,-68);x.stroke();
  x.fillStyle=gold;x.beginPath();x.moveTo(-15,-72);x.lineTo(-13.7,-67);x.lineTo(-16.3,-67);x.closePath();x.fill();
  x.fillStyle='#b3202a';x.beginPath();x.moveTo(-15,-66);x.quadraticCurveTo(-11,-63,-12.5,-58);x.lineTo(-15,-62);x.closePath();x.fill();
  // qo'llar
  x.strokeStyle=br;x.lineWidth=3.1;x.lineCap='round';
  x.beginPath();x.moveTo(-9.6,-46);x.lineTo(-13,-40);x.lineTo(-15,-39);x.stroke();
  x.beginPath();x.moveTo(9.6,-46);x.lineTo(12.8,-40);x.lineTo(13,-37.5);x.stroke();
  // qilich
  x.fillStyle='#4b4a52';x.fillRect(12.4,-37,1.3,20);
  x.fillStyle=gold;x.fillRect(10.6,-38,5,1);
  // bosh
  x.fillStyle=br;x.beginPath();x.arc(0,-55,4.7,0,6.3);x.fill();
  x.fillStyle=dk;x.fillRect(-3.4,-55.4,6.8,3.4);
  x.fillStyle='#ffb04a';x.fillRect(-2.6,-54.6,1.7,.55);x.fillRect(.9,-54.6,1.7,.55);
  x.fillStyle='#8a1620';x.beginPath();x.moveTo(-.5,-60);x.quadraticCurveTo(-8,-67,-9,-57);x.quadraticCurveTo(-5,-60,-.5,-57);x.closePath();x.fill();
  x.fillStyle=gold;x.beginPath();x.moveTo(-4.2,-58.5);x.lineTo(-6.3,-63);x.lineTo(-3,-60.6);x.closePath();x.fill();
  x.beginPath();x.moveTo(4.2,-58.5);x.lineTo(6.3,-63);x.lineTo(3,-60.6);x.closePath();x.fill();
  x.restore();
  // quyosh nuri (o'ng tomondan)
  x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='source-atop';
  var rim=x.createLinearGradient(0,0,c.width,0);
  rim.addColorStop(.45,'rgba(255,140,60,0)');rim.addColorStop(.88,'rgba(255,150,70,.5)');rim.addColorStop(1,'rgba(255,190,110,.75)');
  x.fillStyle=rim;x.fillRect(0,0,c.width,c.height);
  var up=x.createLinearGradient(0,0,0,c.height);
  up.addColorStop(0,'rgba(255,120,50,.25)');up.addColorStop(.5,'rgba(255,120,50,0)');
  x.fillStyle=up;x.fillRect(0,0,c.width,c.height);
  return {cv:c,w:SW,h:SH};
}
function brazierSprite(){
  var BW=16,BH=18,c=mk(BW*u,BH*u),x=c.getContext('2d');x.scale(u,u);x.translate(BW/2,BH);
  var br=x.createLinearGradient(-6,0,6,0);br.addColorStop(0,'#1a1410');br.addColorStop(.6,'#3a2c22');br.addColorStop(1,'#7a5a3a');
  x.fillStyle=br;x.fillRect(-6.5,-2.4,13,2.4);x.fillRect(-5,-9,10,6.6);
  x.strokeStyle='#e0aa48';x.lineWidth=.22;x.strokeRect(-3.6,-8,7.2,4.6);

var keys={},qAtk=null;
var P={x:0,y:0,vx:0,vy:0,dir:1,walk:0,atk:null,sw:0,inited:false,rib:[]};
addEventListener('keydown',function(e){
  if(e.repeat){if(e.code==='Space')e.preventDefault();return;}
  keys[e.code]=true;
  if(e.code==='KeyJ'||e.code==='KeyZ')qAtk='p';
  if(e.code==='KeyK'||e.code==='KeyX')qAtk='k';
  if(e.code==='Space'||e.code.indexOf('Arrow')===0)e.preventDefault();
});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){keys={};});
function bindHold(id,code){
  var el=document.getElementById(id);
  function on(e){e.preventDefault();keys[code]=true;el.classList.add('on');}
  function off(){keys[code]=false;el.classList.remove('on');}
  el.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){el.addEventListener(n,off);});
}
bindHold('l','ArrowLeft');bindHold('r','ArrowRight');bindHold('j','Space');
document.getElementById('p').addEventListener('pointerdown',function(e){e.preventDefault();qAtk='p';});
document.getElementById('k').addEventListener('pointerdown',function(e){e.preventDefault();qAtk='k';});

function update(dt){
  if(!P.inited){P.x=WW/2;camFollow=cam=clamp(P.x-V/2,0,WW-V);P.inited=true;
    P.rib=[];for(var i=0;i<7;i++)P.rib.push({x:P.x,y:FEET-30});}
  var ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  var k=P.atk?.35:1;
  P.vx+=(ax*SPEED*k-P.vx)*Math.min(1,dt*10);
  if(ax&&!P.atk)P.dir=ax;
  P.x=clamp(P.x+P.vx*dt,9,WW-9);
  if((keys.Space||keys.ArrowUp||keys.KeyW)&&P.y===0&&!P.atk)P.vy=62;
  P.vy-=170*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;}
  P.walk+=dt*Math.abs(P.vx)*.34;
  P.sw+=(P.vx*P.dir-P.sw)*Math.min(1,dt*8);
  if(qAtk&&!P.atk){P.atk={type:qAtk,t:0,dur:qAtk==='p'?.34:.46};}
  qAtk=null;
  if(P.atk){P.atk.t+=dt;if(P.atk.t>=P.atk.dur)P.atk=null;}
  // lenta
  var hx=P.x-P.dir*1.6,hy=FEET-P.y-30.2,tr=1-Math.exp(-dt*16);
  P.rib[0].x=hx;P.rib[0].y=hy;
  for(var i=1;i<P.rib.length;i++){
    var q=P.rib[i],pr=P.rib[i-1];
    q.x+=(pr.x-P.dir*1.5-q.x)*tr-P.vx*dt*.35;
    q.y+=(pr.y+.55+Math.sin(T*6+i*.9)*.35*(1-Math.min(1,Math.abs(P.vx)/SPEED))-q.y)*tr;
  }
  // kamera: o'lik zona
  var dz=V*.1,pc=P.x-camFollow,tgt=camFollow;
  if(pc>V/2+dz)tgt=P.x-V/2-dz;else if(pc<V/2-dz)tgt=P.x-V/2+dz;
  camFollow+=(tgt-camFollow)*Math.min(1,dt*5);
  camFollow=clamp(camFollow,0,WW-V);
  introT+=dt;
  var ik=smooth(introT/7);
  cam=introT<7?lerp(0,camFollow,ik):camFollow;
  cam=clamp(cam+Math.sin(T*.35)*.25*ik,0,WW-V);
  // uchqunlar
  BRAZ.forEach(function(bx){
    if(bx<cam-10||bx>cam+V+10)return;
    if(Math.random()<dt*9)EMB.push({x:bx+(Math.random()-.5)*3,y:62.5,vx:(Math.random()-.4)*1.6,vy:-(5+Math.random()*9),life:0,max:1.4+Math.random()*2,s:.12+Math.random()*.22});
  });
  for(i=EMB.length-1;i>=0;i--){var e=EMB[i];e.life+=dt;e.x+=(e.vx+Math.sin(T*3+e.life*5)*.7)*dt;e.y+=e.vy*dt;if(e.life>e.max)EMB.splice(i,1);}
  if(EMB.length>400)EMB.splice(0,EMB.length-400);
}

  }

  g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,220,150,.35)';g.beginPath();g.arc(sx,sy,6.8+Math.sin(T*1.5)*.25,0,6.3);g.fill();
  g.globalCompositeOperation='source-over';

    var sp=SP.clouds[c.spr],w=sp.w*c.sc,h=sp.h*c.sc,span=V+160,x=((c.x+T*c.sp)%span)-80-cam*c.par;

    g.quadraticCurveTo(x+b.sz*.6,y-.5*b.sz-f*.4,x+b.sz*1.5,y-f*.6*b.sz);g.stroke();

  g.lineWidth=.6;g.beginPath();g.arc(0,0,31.4,0,6.3);g.stroke();
  g.beginPath();g.arc(0,0,21,0,6.3);g.lineWidth=1.2;g.stroke();
  g.lineWidth=1;g.setLineDash([2.4,1.5]);g.lineDashOffset=-T*3;g.beginPath();g.arc(0,0,26,0,6.3);g.stroke();g.setLineDash([]);
  g.lineWidth=.5;
  for(var i=0;i<28;i++){var a=i/28*6.283+T*.12;g.beginPath();g.moveTo(Math.cos(a)*28.2,Math.sin(a)*28.2);g.lineTo(Math.cos(a)*30.4,Math.sin(a)*30.4);g.stroke();}
  g.beginPath();
  for(i=0;i<16;i++){var rr=i%2?7:19,a2=i/16*6.283-T*.25;g.lineTo(Math.cos(a2)*rr,Math.sin(a2)*rr);}
  g.closePath();g.fillStyle='rgba(255,196,90,'+(.16+.1*pulse)+')';g.fill();g.lineWidth=.8;g.stroke();
  g.globalCompositeOperation='lighter';
  var cg=g.createRadialGradient(0,0,0,0,0,10);cg.addColorStop(0,'rgba(255,230,160,'+(.8*pulse)+')');cg.addColorStop(1,'rgba(255,150,60,0)');
  g.fillStyle=cg;g.beginPath();g.arc(0,0,10,0,6.3);g.fill();
  g.restore();
}
function flame(x,y,s,ph){
  var fl=.85+.15*Math.sin(T*13+ph)+.06*Math.sin(T*27+ph*2);
  g.globalCompositeOperation='lighter';
  var gr=g.createRadialGradient(x,y-s*1.1,0,x,y-s*1.1,s*3.6);
  gr.addColorStop(0,'rgba(255,150,50,'+(.5*fl)+')');gr.addColorStop(1,'rgba(255,70,10,0)');
  g.fillStyle=gr;g.fillRect(x-s*4,y-s*5,s*8,s*8);
  var cols=['rgba(255,70,15,.55)','rgba(255,160,40,.6)','rgba(255,235,150,.75)'],hs=[1,.72,.45],ws=[1,.7,.4];
  for(var l=0;l<3;l++){
    for(var k=0;k<3;k++){
      var p2=ph+k*2.1+l*.7,sway=Math.sin(T*6.5+p2)*.28*s,hh=s*(1.9+.55*Math.sin(T*9+p2*1.7))*hs[l]*(k===1?1.25:.85),ww=s*.55*ws[l],ox=x+(k-1)*s*.5;
      g.fillStyle=cols[l];g.beginPath();g.moveTo(ox-ww,y);
      g.bezierCurveTo(ox-ww*1.2,y-hh*.5,ox+sway*.5,y-hh*.7,ox+sway,y-hh);
      g.bezierCurveTo(ox+ww*1.1+sway*.4,y-hh*.6,ox+ww*1.2,y-hh*.3,ox+ww,y);g.closePath();g.fill();
    }
  }
  g.globalCompositeOperation='source-over';
}
function floorGlow(){
  g.globalCompositeOperation='lighter';
  BRAZ.forEach(function(bx,i){
    var x=bx-cam;if(x<-30||x>V+30)return;
    var fl=.8+.2*Math.sin(T*11+i*2.3)+.05*Math.sin(T*23+i);
    var cx=projX(bx,80);g.save();g.translate(cx,81);g.scale(1,.28);
    var gr=g.createRadialGradient(0,0,0,0,0,24);gr.addColorStop(0,'rgba(255,140,50,'+(.36*fl)+')');gr.addColorStop(1,'rgba(255,80,20,0)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,24,0,6.3);g.fill();g.restore();
    // aks (yuza ustiga uzayadi)
    var rg=g.createLinearGradient(0,FY0,0,FY1);rg.addColorStop(0,'rgba(255,150,60,'+(.18*fl)+')');rg.addColorStop(1,'rgba(255,100,30,0)');
    g.fillStyle=rg;g.beginPath();g.moveTo(cx-1.2,FY0);g.lineTo(cx+1.2,FY0);g.lineTo(cx+4,FY1);g.lineTo(cx-4,FY1);g.fill();
  });
  g.globalCompositeOperation='source-over';
}
function drawBackProps(){
  var i;
  // statuyalar
  STAT.forEach(function(s){
    var x=s.x-cam;if(x<-30||x>V+30)return;
    var sp=SP.stat[s.flip?1:0],sc=s.s,w=sp.w*sc,h=sp.h*sc,by=79;
    // aks
    g.save();g.globalAlpha=.16;g.translate(x-w/2,by);g.scale(1,-.45);g.drawImage(sp.cv,0,-0,w,h);g.restore();
    g.drawImage(sp.cv,x-w/2,by-h,w,h);
  });
  // panjara
  var x0=Math.max(0,Math.floor((cam-4)/3.2)*3.2),x1=cam+V+4,gp=16,RB=75,RT=66.5;
  var rg=g.createLinearGradient(0,RT,0,RB);rg.addColorStop(0,'#3a2a28');rg.addColorStop(1,'#1a0f12');
  for(var wx=x0;wx<=x1;wx+=3.2){
    var sx=wx-cam;
    if(Math.abs(((wx%gp)+gp)%gp)<.01||Math.abs(((wx%gp)+gp)%gp-gp)<.01){continue;}
    g.fillStyle=rg;g.fillRect(sx-.5,RT+1.2,1,RB-RT-1.8);
    g.fillStyle='rgba(255,150,70,.35)';g.fillRect(sx+.1,RT+1.2,.3,RB-RT-1.8);
  }
  g.fillStyle='#2a1a1a';g.fillRect(-2,RT,V+4,1.2);g.fillRect(-2,RB-1.1,V+4,1.2);
  g.fillStyle='rgba(255,160,80,.55)';g.fillRect(-2,RT,V+4,.22);
  var p0=Math.floor((cam-4)/gp)*gp;
  for(var px=p0;px<=x1;px+=gp){
    var sx2=px-cam,lf=.82+.18*Math.sin(T*10+px);
    g.fillStyle='#241615';g.fillRect(sx2-1,RT-2.4,2,RB-RT+2.4);
    g.fillStyle='#352120';g.fillRect(sx2-1.5,RT-3.2,3,1);g.fillRect(sx2-1.5,RB-1.4,3,1.4);
    g.fillStyle='rgba(255,150,70,.45)';g.fillRect(sx2+.6,RT-2.4,.35,RB-RT+2.4);
    g.fillStyle='#3a2420';g.beginPath();g.moveTo(sx2-1.2,RT-3.2);g.lineTo(sx2,RT-5);g.lineTo(sx2+1.2,RT-3.2);g.fill();
    g.globalCompositeOperation='lighter';
    var lg=g.createRadialGradient(sx2,RT-4,0,sx2,RT-4,4.2);lg.addColorStop(0,'rgba(255,180,80,'+(.5*lf)+')');lg.addColorStop(1,'rgba(255,100,30,0)');
    g.fillStyle=lg;g.fillRect(sx2-4.5,RT-8.5,9,9);g.globalCompositeOperation='source-over';
    g.fillStyle='#ffc060';g.fillRect(sx2-.35,RT-4.6,.7,1.1);
  }
  // alanga va manqallar
  BRAZ.forEach(function(bx,j){
    var x=bx-cam;if(x<-14||x>V+14)return;
    g.drawImage(SP.braz.cv,x-8,79-SP.braz.h,SP.braz.w,SP.braz.h);
    flame(x,79-14.3,2.3,j*1.9);
  });
  // bayroqlar
  BANN.forEach(function(b){
    var x=b.x-cam;if(x<-14||x>V+14)return;
    var s=b.s,ph=79,top=ph-62*s;
    g.fillStyle='#1e1212';g.fillRect(x-.5,top,1,ph-top);
    g.fillStyle='#e0aa48';g.beginPath();g.arc(x,top-.4,.9,0,6.3);g.fill();
    g.fillStyle='#2a1a18';g.fillRect(x-6.2*s,top+.8,12.4*s,.8);
    // mato: vertikal polosalar bilan to'lqinlanadi
    var sp=SP.banner,bw=sp.w*s*.88,bh=sp.h*s*1.7,n=22,sw=bw/n,srcw=sp.cv.width/n,y0=top+1.8;
    for(var i2=0;i2<n;i2++){
      var t=i2/n,wave=Math.sin(T*2.4-t*4.4+b.x)*1.1*s*(.25+t);
      g.drawImage(sp.cv,i2*srcw,0,srcw+.6,sp.cv.height,x-bw/2+i2*sw,y0+wave,sw+.12,bh*(1+Math.sin(T*2.4-t*4.4+b.x)*.015));
      var sh=Math.cos(T*2.4-t*4.4+b.x)*.12;
      g.fillStyle=sh>0?'rgba(255,170,120,'+sh*.5+')':'rgba(0,0,0,'+(-sh*.9)+')';

}
function drawEmbers(){
  g.globalCompositeOperation='lighter';
  EMB.forEach(function(e){
    var a=1-e.life/e.max,x=e.x-cam;if(x<-3||x>V+3)return;
    g.fillStyle='rgba(255,'+(120+a*100|0)+',50,'+a*.9+')';g.beginPath();g.arc(x,e.y,e.s,0,6.3);g.fill();
    g.fillStyle='rgba(255,140,50,'+a*.18+')';g.beginPath();g.arc(x,e.y,e.s*3.5,0,6.3);g.fill();
  });
  g.globalCompositeOperation='source-over';

/* ----- qahramon ----- */
function pt(x,y,a,l){return [x+Math.sin(a)*l,y+Math.cos(a)*l];}
function drawFighter(refl){
  var m=Math.min(1,Math.abs(P.vx)/SPEED),air=clamp(P.y/3,0,1);
  var atk=P.atk,pK=0,kK=0;
  if(atk){var ap=atk.t/atk.dur,kk=ap<.3?ap/.3:ap<.5?1:1-(ap-.5)/.5;kk=smooth(kk);if(atk.type==='p')pK=kk;else kK=kk;}
  var ph=P.walk,lean=m*.1+pK*.14-kK*.22-air*.04,bob=Math.sin(T*2.7)*.35*(1-m)*(1-air);
  function leg(sth,ssh,wph){
    var wt=Math.sin(wph)*.78,ws=wt-.95*Math.max(0,Math.cos(wph));
    var th=lerp(sth,wt,m),sh=lerp(ssh,ws,m);return [th,sh];
  }
  var F=leg(.5,.05,ph),B=leg(-.42,-.5,ph+3.14159);
  F=[lerp(F[0],.95,air),lerp(F[1],-.1,air)];B=[lerp(B[0],-.15,air),lerp(B[1],-1.15,air)];
  if(kK){F=[lerp(F[0],1.5,kK),lerp(F[1],1.55,kK)];B=[lerp(B[0],-.1,kK),lerp(B[1],-.15,kK)];}
  var LL=7.6,reach=Math.max(Math.cos(F[0])*LL+Math.cos(F[1])*LL,Math.cos(B[0])*LL+Math.cos(B[1])*LL);
  if(kK>.1)reach=Math.cos(B[0])*LL+Math.cos(B[1])*LL;
  var hipY=-reach+bob,hx=0;
  var shx=hx+Math.sin(lean)*11,shy=hipY-Math.cos(lean)*11,hdx=shx+Math.sin(lean)*4.4+.7,hdy=shy-4.6;
  // qo'llar
  var gF=[.55,2.55],gB=[.12,2.25],aw=Math.sin(ph)*.7*m;
  var AF=[lerp(gF[0],-aw*.9+.2,m*.7),lerp(gF[1],-aw*.9+1.1,m*.7)],AB=[lerp(gB[0],aw*.9,m*.7),lerp(gB[1],aw*.9+1,m*.7)];
  AF=[lerp(AF[0],1.15,air),lerp(AF[1],2.3,air)];AB=[lerp(AB[0],-.8,air),lerp(AB[1],1.8,air)];
  if(pK){AF=[lerp(AF[0],1.52,pK),lerp(AF[1],1.56,pK)];AB=[lerp(AB[0],-.35,pK),lerp(AB[1],1.6,pK)];}
  var AL=5.1;
  function arm(ox,oy,a,col){
    var e=pt(ox,oy,a[0],AL),h=pt(e[0],e[1],a[1],AL);
    g.lineCap='round';g.strokeStyle=col;g.lineWidth=2.7;g.beginPath();g.moveTo(ox,oy);g.lineTo(e[0],e[1]);g.stroke();
    g.strokeStyle='#e3b04b';g.lineWidth=2.5;var w=pt(e[0],e[1],a[1],AL*.55);g.beginPath();g.moveTo(w[0],w[1]);g.lineTo(h[0],h[1]);g.stroke();
    g.strokeStyle='#8a1620';g.lineWidth=2.6;g.beginPath();g.moveTo(e[0],e[1]);g.lineTo(w[0],w[1]);g.stroke();
    g.fillStyle='#e0b28a';g.beginPath();g.arc(h[0],h[1],1.45,0,6.3);g.fill();return h;
  }
  function legDraw(a,col){
    var kn=pt(hx,hipY,a[0],LL),ft=pt(kn[0],kn[1],a[1],LL);
    g.lineCap='round';g.strokeStyle=col;g.lineWidth=3.3;g.beginPath();g.moveTo(hx,hipY);g.lineTo(kn[0],kn[1]);g.lineTo(ft[0],ft[1]);g.stroke();
    g.strokeStyle='#e3b04b';g.lineWidth=3.4;var sp=pt(kn[0],kn[1],a[1],LL*.72);g.beginPath();g.moveTo(sp[0],sp[1]);g.lineTo(ft[0]-Math.sin(a[1])*.5,ft[1]-Math.cos(a[1])*.5);g.stroke();
    g.strokeStyle='#0e0b14';g.lineWidth=2.4;g.beginPath();g.moveTo(ft[0],ft[1]);g.lineTo(ft[0]+Math.cos(a[1])*2.6,ft[1]-Math.sin(a[1])*2.6);g.stroke();
    return ft;
  }
  var sw=clamp(P.sw/SPEED,-1,1)*2.6;
  var hF,fF;
  arm(shx-.8,shy+.6,AB,'#6d1220');
  legDraw(B,'#171a32');
  // yubka
  var skg=g.createLinearGradient(0,hipY,0,hipY+9);skg.addColorStop(0,'#a41e2c');skg.addColorStop(1,'#5a0e1c');
  g.fillStyle=skg;g.beginPath();g.moveTo(hx-3.2,hipY-.5);g.lineTo(hx+3.2,hipY-.5);
  g.quadraticCurveTo(hx+4.6-sw*.6,hipY+5,hx+4.4-sw,hipY+9.2+Math.sin(T*8)*.2);g.lineTo(hx-4.4-sw,hipY+9.2);
  g.quadraticCurveTo(hx-4.6-sw*.6,hipY+5,hx-3.2,hipY-.5);g.fill();
  g.strokeStyle='#e3b04b';g.lineWidth=.3;g.beginPath();g.moveTo(hx-4.3-sw,hipY+8.7);g.lineTo(hx+4.3-sw,hipY+8.7);g.stroke();
  // tana
  var tg=g.createLinearGradient(-3,0,3,0);tg.addColorStop(0,'#8a1620');tg.addColorStop(.6,'#c4202c');tg.addColorStop(1,'#a01826');
  g.fillStyle=tg;g.beginPath();g.moveTo(shx-3.5,shy);g.lineTo(shx+3.5,shy);g.lineTo(hx+3,hipY);g.lineTo(hx-3,hipY);g.closePath();g.fill();
  g.strokeStyle='#e3b04b';g.lineWidth=.3;g.beginPath();g.moveTo(shx+.4,shy);g.lineTo(hx+.2,hipY);g.stroke();
  g.fillStyle='#e3b04b';g.fillRect(hx-3.1,hipY-1.5,6.2,1.3);
  g.fillStyle='#f0e4d0';g.beginPath();g.moveTo(shx-2,shy);g.lineTo(shx+.5,shy+2.6);g.lineTo(shx+2.4,shy);g.closePath();g.fill();
  fF=legDraw(F,'#1d2038');
  // bosh
  g.fillStyle='#e0b28a';g.beginPath();g.arc(hdx,hdy,3.3,0,6.3);g.fill();
  g.fillStyle='#15121b';g.beginPath();g.arc(hdx-.6,hdy-.6,3.4,3.4,6.0);g.fill();
  g.beginPath();g.arc(hdx-1.7,hdy-3.7,1.6,0,6.3);g.fill();
  g.fillStyle='#b3202a';g.fillRect(hdx-3.3,hdy-1.3,6.6,.9);
  g.fillStyle='#15121b';g.fillRect(hdx+1.1,hdy-.1,1.5,.5);
  hF=arm(shx+.8,shy+.6,AF,'#a41e2c');
  return {hand:hF,foot:fF,pK:pK,kK:kK,fx:shx,hipY:hipY};
}
function renderFighter(){
  var fx=P.x-cam,fy=FEET-P.y;
  g.fillStyle='rgba(0,0,0,'+(.45*(1-P.y/60))+')';g.beginPath();g.ellipse(fx,FEET+.9,7.5*(1-P.y/90),1.7,0,0,6.3);g.fill();
  // aks
  g.save();g.globalAlpha=.17;g.translate(fx,fy);g.scale(P.dir,-1);drawFighter();g.restore();
  g.save();g.translate(fx,fy);g.scale(P.dir,1);var info=drawFighter();g.restore();
  // lenta
  g.save();g.translate(-cam,0);
  g.lineCap='round';g.lineJoin='round';
  for(var i=1;i<P.rib.length;i++){
    var a=P.rib[i-1],b=P.rib[i];
    g.strokeStyle=i%2?'#c4202c':'#8a1620';g.lineWidth=Math.max(.3,1.15-i*.14);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  }
  g.restore();
  // zarba effekti
  if(info.pK>.55||info.kK>.55){
    var ex=fx+P.dir*(info.pK>.55?info.hand[0]:info.foot[0]),ey=fy+(info.pK>.55?info.hand[1]:info.foot[1]);
    var k=Math.max(info.pK,info.kK);
    g.globalCompositeOperation='lighter';
    var gr=g.createRadialGradient(ex,ey,0,ex,ey,6);gr.addColorStop(0,'rgba(255,240,190,'+(.9*k)+')');gr.addColorStop(1,'rgba(255,120,40,0)');
    g.fillStyle=gr;g.beginPath();g.arc(ex,ey,6,0,6.3);g.fill();
    g.strokeStyle='rgba(255,220,150,'+(.7*k)+')';g.lineWidth=.5;g.beginPath();
    g.arc(ex-P.dir*3,ey,8*k+2,P.dir>0?-1.1:Math.PI-1.1+1.2,P.dir>0?1.1:Math.PI+1.1,false);g.stroke();
    g.globalCompositeOperation='source-over';
  }
}
function drawLeaves(){
  var span=V+40;
  LEAVES.forEach(function(l){
    var y=((l.y+T*l.vy)%110)-5,sway=Math.sin(T*1.3+l.ph)*3;
    var x=((((l.wx+T*l.wind*2.2+sway)-cam*l.d)%span)+span)%span-20;
    g.save();g.translate(x,y);g.rotate(l.rot+T*(.6+l.d*.4));g.scale(1,Math.cos(T*2+l.ph));
    var s=.055*l.sc*(l.d>1.2?1.4:1);g.globalAlpha=.9;g.drawImage(SP.petal[l.c],-12*s*4,-12*s*4,24*s*4,24*s*4);g.restore();
  });
  g.globalAlpha=1;
}
function post(){
  var vg=g.createRadialGradient(V/2,50,30,V/2,50,Math.max(V,100)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(8,2,12,.62)');
  g.fillStyle=vg;g.fillRect(0,0,V,100);
  g.globalCompositeOperation='soft-light';
  var wg=g.createLinearGradient(0,0,V,0);wg.addColorStop(0,'rgba(90,60,160,.35)');wg.addColorStop(1,'rgba(255,150,70,.45)');
  g.fillStyle=wg;g.fillRect(0,0,V,100);
  g.globalCompositeOperation='source-over';
  var bg=g.createLinearGradient(0,92,0,100);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle=bg;g.fillRect(0,92,V,8);
}
function render(){
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);
  blit(L.sky);unitT();drawSkyDynamic();
  blit(L.far);unitT();drawFalls(L.far);drawMist(MISTS[0]);
  blit(L.mid);unitT();drawFalls(L.mid);
  blit(L.near);unitT();drawFalls(L.near);drawMist(MISTS[1]);drawMist(MISTS[2]);
  drawFloor();drawEmblem();floorGlow();drawBackProps();
  renderFighter();
  drawEmbers();
  g.globalAlpha=.16;g.drawImage(SP.mist[2],-V*.1+Math.sin(T*.2)*6,74,V*1.3,10);g.globalAlpha=1;
  blit(L.fg);unitT();drawLeaves();post();
}

var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  update(dt);render();requestAnimationFrame(frame);
}
resize();
window.__arena={get cam(){return cam;},set cam(v){introT=99;camFollow=v;cam=v;},get V(){return V;},get WW(){return WW;},P:P};
requestAnimationFrame(frame);
})();
