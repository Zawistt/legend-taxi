<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Samarqand 2D xaritasi</title>
<!--
  Samarqand shahrining 2D modeli.
  Fon tayllari o'rniga shahar OpenStreetMap ma'lumotlaridan (Overpass API)
  vektor ko'rinishda chiziladi: yo'llar, binolar, suv, bog'lar, temir yo'l.
  Avval shaharning haqiqiy ma'muriy chegarasi olinadi, keyin katta yo'llar,
  suv va bog'lar butun shahar uchun bir so'rovda, so'ng chegara ichidagi
  BARCHA uylar va ko'chalar (piyoda yo'laklari, so'qmoq, zinapoyagacha)
  kataklarga bo'linib fonda yuklanadi — avval ekrandagi joy, keyin qolgani.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --fon:#0E1621; --panel:#17212B; --panel2:#1F2C38;
    --matn:#EDF2F7; --xira:#7D8B99; --sariq:#F2B705;
    --yashil:#2FA84F; --qizil:#E0453A; --chegara:#26333F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    background:var(--fon);color:var(--matn);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}

  #xarita{position:absolute;inset:0;background:var(--fon)}
  .leaflet-container{background:var(--fon)}
  .leaflet-control-attribution{
    background:rgba(14,22,33,.75)!important;color:var(--xira)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--xira)!important}

  #sarlavha{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;
    z-index:500;display:flex;align-items:center;gap:8px;pointer-events:none}
  #sarlavha .quti{pointer-events:auto;background:rgba(23,33,43,.92);border:1px solid var(--chegara);
    border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
  #nom{font-weight:700;font-size:15px}
  #nom small{display:block;font-weight:400;font-size:11px;color:var(--xira);margin-top:2px}
  #holat{margin-left:auto;font-size:12px;color:var(--xira);white-space:nowrap}
  #holat.yuklanmoqda::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;
    border-radius:50%;background:var(--sariq);animation:puls 1s infinite}
  @keyframes puls{50%{opacity:.25}}

  #tugmalar{position:absolute;right:10px;bottom:calc(150px + env(safe-area-inset-bottom));
    z-index:500;display:flex;flex-direction:column;gap:8px}
  .yumaloq{width:44px;height:44px;border-radius:12px;border:1px solid var(--chegara);
    background:rgba(23,33,43,.95);color:var(--matn);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .yumaloq.faol{background:var(--sariq);color:#111;border-color:var(--sariq)}

  #pastki{position:absolute;left:0;right:0;bottom:0;z-index:500;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(14,22,33,.97) 60%,rgba(14,22,33,0))}
  #joylar{display:flex;gap:8px;overflow-x:auto;padding:0 10px 4px;scrollbar-width:none}
  #joylar::-webkit-scrollbar{display:none}
  .joy{flex:0 0 auto;background:var(--panel2);border:1px solid var(--chegara);color:var(--matn);
    border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .joy:active{background:var(--sariq);color:#111}
  #izoh{display:flex;flex-wrap:wrap;gap:10px;padding:8px 12px 0;font-size:11px;color:var(--xira)}
  #izoh i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}

  .belgi-yorliq{background:transparent;border:0}
  .belgi-yorliq div{transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;
    white-space:nowrap;font-size:12px;font-weight:600;color:var(--sariq);
    text-shadow:0 0 3px #000,0 0 6px #000}
  .belgi-yorliq span{width:10px;height:10px;border-radius:50%;background:var(--sariq);
    box-shadow:0 0 0 3px rgba(242,183,5,.3);flex:0 0 auto}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--matn)}
  .leaflet-popup-content{margin:10px 12px;font-size:13px}
  .leaflet-popup-content b{color:var(--sariq)}
</style>
</head>
<body>
<div id="xarita"></div>

<div id="sarlavha">
  <div class="quti" id="nom">Samarqand <small>2D shahar modeli</small></div>
  <div class="quti" id="holat">Tayyorlanmoqda…</div>
</div>

<div id="tugmalar">
  <button class="yumaloq" id="t-fon" title="Fon xarita (tayllar)">🗺</button>
  <button class="yumaloq" id="t-men" title="Mening joylashuvim">◎</button>
  <button class="yumaloq" id="t-shahar" title="Butun shahar">⌂</button>
</div>

<div id="pastki">
  <div id="joylar"></div>
  <div id="izoh">
    <span><i style="background:#F2B705"></i>Tarixiy obida</span>
    <span><i style="background:#3A4A5C"></i>Bino</span>
    <span><i style="background:#C9D3DD;height:3px"></i>Katta yo'l</span>
    <span><i style="background:#1F6FB2"></i>Suv</span>
    <span><i style="background:#1E4D2B"></i>Bog'</span>
    <span><i style="background:#9C8660;height:2px"></i>Piyoda yo'lak</span>
    <span><i style="background:transparent;border:1.5px dashed #F2B705;height:9px"></i>Shahar chegarasi</span>
  </div>
</div>

<script>
(function(){
'use strict';

// ---------------- Sozlamalar ----------------
// Haqiqiy shahar chegarasi OSM'dan olinadi; bu to'rtburchak faqat zaxira.
const ZAXIRA_CHEGARA = [[39.600, 66.870], [39.720, 67.060]];
const MARKAZ = [39.6547, 66.9757];                 // Registon
const UY_ZOOM = 14;                                 // uylar va mayda ko'chalar shu zoomdan ko'rinadi
const KATAK = 0.012;                                // yuklash katagi, gradus (~1.3 km)
const ISHCHI = 2;                                   // bir vaqtda nechta so'rov

const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];

// Diqqatga sazovor joylar (koordinatalar OSM/Vikipediya bo'yicha)
const JOYLAR = [
  { nom:"Registon",               k:[39.6547, 66.9757], z:17, t:"XV–XVII asr. Ulug'bek, Sherdor va Tillakori madrasalari." },
  { nom:"Go'ri Amir",             k:[39.6484, 66.9691], z:18, t:"Amir Temur maqbarasi, XV asr boshlari." },
  { nom:"Bibixonim masjidi",      k:[39.6607, 66.9797], z:17, t:"Amir Temur qurdirgan jome masjidi, 1399–1404." },
  { nom:"Siyob bozori",           k:[39.6617, 66.9812], z:17, t:"Shaharning eng qadimiy va katta bozori." },
  { nom:"Hazrati Xizr masjidi",   k:[39.6621, 66.9860], z:18, t:"Afrosiyob tepaligi yonidagi masjid." },
  { nom:"Shohi Zinda",            k:[39.6632, 66.9881], z:17, t:"XI–XIX asrlarga oid maqbaralar majmuasi." },
  { nom:"Afrosiyob",              k:[39.6690, 66.9930], z:16, t:"Qadimiy Samarqand shahri xarobalari va muzeyi." },
  { nom:"Ulug'bek rasadxonasi",   k:[39.6747, 67.0058], z:17, t:"Mirzo Ulug'bek rasadxonasi, 1420-yillar." },
  { nom:"Aeroport",               k:[39.7005, 66.9837], z:15, t:"Samarqand xalqaro aeroporti." }
];

// ---------------- Xarita ----------------
const xrt = L.map('xarita', {
  zoomControl:false, preferCanvas:true,
  minZoom:11, maxZoom:20,
  maxBounds:L.latLngBounds(ZAXIRA_CHEGARA).pad(0.5),
  attributionControl:true
}).setView(MARKAZ, 14);
xrt.attributionControl.setPrefix(false);
xrt.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>');

const chizgich = L.canvas({ padding:0.5, tolerance:4 });

// Pane'lar: pastdan yuqoriga — yer, suv, mayda yo'l, bino, katta yo'l, niqob, chegara
[['yer',350],['suv',360],['yol',370],['bino',380],['yolUst',390],['niqob',395],['chegara',396]]
  .forEach(([n,z]) => { xrt.createPane(n).style.zIndex = z; });

const fonTayl = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd', maxZoom:20, attribution:'© CARTO', opacity:0.55
});

const qatlam = {
  yer:     L.layerGroup().addTo(xrt),
  suv:     L.layerGroup().addTo(xrt),
  yol:     L.layerGroup().addTo(xrt),
  temir:   L.layerGroup().addTo(xrt),
  bino:    L.layerGroup(),          // UY_ZOOM dan
  mayda:   L.layerGroup(),          // UY_ZOOM dan
  chegara: L.layerGroup().addTo(xrt),
  belgi:   L.layerGroup().addTo(xrt)
};

// ---------------- Uslublar ----------------
// w: [zoom<14, 14–15, 16–17, 18+]
const YOL_USLUB = {
  motorway:{c:'#F2B705',w:[3,5,8,12]},   trunk:{c:'#F2B705',w:[2.5,4.5,7,11]},
  primary:{c:'#E8C766',w:[2,4,7,11]},    secondary:{c:'#C9D3DD',w:[1.5,3,6,10]},
  tertiary:{c:'#A7B3BF',w:[1,2.5,5,8]},
  residential:{c:'#6B7B8B',w:[0.4,1.5,3.5,6]}, unclassified:{c:'#6B7B8B',w:[0.4,1.5,3.5,6]},
  living_street:{c:'#5F6E7C',w:[0.3,1.2,3,5]}, service:{c:'#4E5B68',w:[0.2,0.8,2.2,4]},
  road:{c:'#5F6E7C',w:[0.3,1,2.5,4]},
  pedestrian:{c:'#8A6F3A',w:[0.4,1.5,3.5,6]},
  track:{c:'#6E5A3A',w:[0.2,0.8,1.8,3],d:'5 4'},
  footway:{c:'#9C8660',w:[0.2,0.6,1.2,2],d:'3 3'},
  path:{c:'#9C8660',w:[0.2,0.6,1.2,2],d:'3 3'},
  cycleway:{c:'#3E8FC4',w:[0.2,0.6,1.4,2.2],d:'4 3'},
  steps:{c:'#C47A3E',w:[0.2,0.8,2,3],d:'1 2'},
  bridleway:{c:'#6E5A3A',w:[0.2,0.6,1.2,2],d:'3 3'}
};
function yolUslubi(tur){
  return YOL_USLUB[tur.replace('_link','')] || YOL_USLUB.service;
}
function zoomIndeks(z){ return z < 14 ? 0 : z < 16 ? 1 : z < 18 ? 2 : 3; }

function tarixiymi(tg){
  return !!(tg.historic || tg.amenity === 'place_of_worship' ||
    ['mosque','mausoleum','madrasa','church','temple','cathedral','shrine'].includes(tg.building) ||
    tg.tourism === 'attraction' || tg.heritage);
}
function binoUslubi(tg){
  const b = tg.building;
  if (tarixiymi(tg))                    return {color:'#B8870A', fillColor:'#F2B705', fillOpacity:0.85};
  if (b === 'apartments')               return {color:'#2E3C4B', fillColor:'#40536A', fillOpacity:0.9};
  if (['house','detached','semidetached_house','terrace','residential'].includes(b))
                                         return {color:'#2A3642', fillColor:'#3E4E60', fillOpacity:0.85};
  if (['commercial','retail','office','industrial','warehouse','supermarket','kiosk'].includes(b))
                                         return {color:'#34404D', fillColor:'#4F4A62', fillOpacity:0.9};
  if (['school','university','college','kindergarten','hospital','public','government','civic'].includes(b))
                                         return {color:'#2E4450', fillColor:'#3C6070', fillOpacity:0.9};
  if (['garage','garages','shed','roof','hut'].includes(b))
                                         return {color:'#252F39', fillColor:'#2F3A46', fillOpacity:0.85};
  return {color:'#2A3642', fillColor:'#3A4A5C', fillOpacity:0.85};
}

// ---------------- Geometriya ----------------
function nuqtalar(el){ return (el.geometry || []).map(p => [p.lat, p.lon]); }
const teng = (a,b) => a[0] === b[0] && a[1] === b[1];
function yopiqmi(k){ return k.length > 3 && teng(k[0], k[k.length-1]); }

// Relation a'zolarini halqalarga ulash (role: 'outer' yoki 'inner')
function halqalar(el, rol){
  const bolaklar = (el.members || [])
    .filter(m => m.type === 'way' && m.geometry && (rol === 'inner' ? m.role === 'inner' : m.role !== 'inner'))
    .map(m => m.geometry.map(p => [p.lat, p.lon]));
  const natija = [];
  while (bolaklar.length){
    let h = bolaklar.shift();
    let ozgardi = true;
    while (!yopiqmi(h) && ozgardi){
      ozgardi = false;
      for (let i = 0; i < bolaklar.length; i++){
        const b = bolaklar[i], bosh = h[0], oxir = h[h.length-1];
        if      (teng(oxir, b[0]))            h = h.concat(b.slice(1));
        else if (teng(oxir, b[b.length-1]))   h = h.concat(b.slice(0,-1).reverse());
        else if (teng(bosh, b[b.length-1]))   h = b.slice(0,-1).concat(h);
        else if (teng(bosh, b[0]))            h = b.slice(1).reverse().concat(h);
        else continue;
        bolaklar.splice(i,1); ozgardi = true; break;
      }
    }
    natija.push(h);
  }
  return natija;
}
function shakl(el){
  if (el.type !== 'relation') return [nuqtalar(el)];
  const ichki = halqalar(el, 'inner');
  // teshikli ko'pburchak: [tashqi, ...ichki]
  return halqalar(el, 'outer').map(t => ichki.length ? [t, ...ichki] : t);
}
function ichidami(n, halqa){           // nuqta ko'pburchak ichidami (ray casting)
  let ich = false;
  for (let i = 0, j = halqa.length - 1; i < halqa.length; j = i++){
    const [yi,xi] = halqa[i], [yj,xj] = halqa[j];
    if ((yi > n[0]) !== (yj > n[0]) && n[1] < (xj - xi) * (n[0] - yi) / (yj - yi) + xi) ich = !ich;
  }
  return ich;
}
function chegaradami(n){
  if (!chegaraHalqa) return CHEGARA.contains(n);
  return chegaraHalqa.some(h => ichidami(n, h));
}

// ---------------- Overpass ----------------
async function overpass(sorov, boshlash){
  let oxirgiXato;
  for (let i = 0; i < OVERPASS.length; i++){
    const url = OVERPASS[((boshlash || 0) + i) % OVERPASS.length];
    try{
      const j = await fetch(url, {
        method:'POST',
        body:'data=' + encodeURIComponent(sorov),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}
      });
      if (!j.ok) throw new Error('HTTP ' + j.status);
      return (await j.json()).elements || [];
    }catch(e){ oxirgiXato = e; }
  }
  throw oxirgiXato;
}
const bboxMatn = (j,g,s,sh) => `(${j},${g},${s},${sh})`;
function xavfsiz(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Holat ----------------
const holatEl = document.getElementById('holat');
let asosiyTayyor = false;
function holat(matn, yuklanmoqda){
  holatEl.textContent = matn;
  holatEl.classList.toggle('yuklanmoqda', !!yuklanmoqda);
}
function holatniYangila(){
  const jami = barchaKatak.length, tayyor = yuklangan.size;
  if (!asosiyTayyor)            holat('Shahar yuklanmoqda…', true);
  else if (jami && tayyor < jami)
    holat(`Uylar: ${Math.round(tayyor / jami * 100)}% (${tayyor}/${jami})`, true);
  else if (xrt.getZoom() < UY_ZOOM) holat('Yaqinlashtiring → uylar');
  else                          holat('Butun shahar yuklandi');
}

// ---------------- 1. Shahar chegarasi ----------------
let CHEGARA = L.latLngBounds(ZAXIRA_CHEGARA);
let chegaraHalqa = null;

async function chegaraYukla(){
  const [[j,g],[s,sh]] = ZAXIRA_CHEGARA;
  const sorov = `[out:json][timeout:60];
relation["boundary"="administrative"]["admin_level"~"^(5|6|7|8)$"]${bboxMatn(j-0.08,g-0.1,s+0.08,sh+0.1)};
out geom;`;
  try{
    const els = await overpass(sorov);
    const nomlar = tg => [tg.name, tg['name:uz'], tg['name:ru'], tg['name:en']].filter(Boolean).join(' ');
    const mos = els
      .filter(el => /samar|самар/i.test(nomlar(el.tags || {})) &&
                    !/viloyat|вилоят|област|region|tuman|район|district/i.test(nomlar(el.tags || {})))
      .map(el => ({el, h:halqalar(el, 'outer').filter(yopiqmi)}))
      .filter(x => x.h.length && x.h.some(h => ichidami(MARKAZ, h)));
    if (!mos.length) throw new Error('chegara topilmadi');
    // bir nechta bo'lsa — eng kattasi (shahar), tuman ichidagi mahalla emas
    mos.sort((a,b) => L.latLngBounds(b.h.flat()).getNorthEast().distanceTo(L.latLngBounds(b.h.flat()).getSouthWest())
                    - L.latLngBounds(a.h.flat()).getNorthEast().distanceTo(L.latLngBounds(a.h.flat()).getSouthWest()));
    chegaraHalqa = mos[0].h;
    CHEGARA = L.latLngBounds(chegaraHalqa.flat());
  }catch(e){
    console.warn('Shahar chegarasi olinmadi, to\'rtburchak ishlatiladi', e);
    chegaraHalqa = null;
  }
  const halqa = chegaraHalqa || [[
    CHEGARA.getSouthWest(), CHEGARA.getNorthWest(), CHEGARA.getNorthEast(), CHEGARA.getSouthEast()
  ].map(p => [p.lat, p.lng])];

  // chegaradan tashqarini qoraytiruvchi niqob
  const t = CHEGARA.pad(3);
  const dunyo = [[t.getSouth(),t.getWest()],[t.getNorth(),t.getWest()],[t.getNorth(),t.getEast()],[t.getSouth(),t.getEast()]];
  L.polygon([dunyo, ...halqa], {renderer:chizgich, pane:'niqob', stroke:false,
    fillColor:'#070C12', fillOpacity:0.55, interactive:false}).addTo(qatlam.chegara);
  halqa.forEach(h => {
    L.polygon(h, {renderer:chizgich, pane:'chegara', color:'#F2B705', weight:6, opacity:0.15, fill:false, interactive:false}).addTo(qatlam.chegara);
    L.polygon(h, {renderer:chizgich, pane:'chegara', color:'#F2B705', weight:1.6, opacity:0.9, dashArray:'8 5', fill:false, interactive:false}).addTo(qatlam.chegara);
  });
  xrt.setMaxBounds(CHEGARA.pad(0.4));
}

// ---------------- 2. Asosiy qatlam (butun shahar) ----------------
function yolChiz(el, guruh){
  const tur = el.tags.highway;
  const us = yolUslubi(tur);
  const katta = guruh === qatlam.yol;
  const chiziq = L.polyline(nuqtalar(el), {
    renderer:chizgich, pane: katta ? 'yolUst' : 'yol',
    color:us.c, weight:us.w[zoomIndeks(xrt.getZoom())], opacity:0.95,
    dashArray:us.d, lineCap: us.d ? 'butt' : 'round', lineJoin:'round',
    interactive: katta && !!el.tags.name
  });
  chiziq._yolTuri = tur;
  if (katta && el.tags.name) chiziq.bindPopup('<b>' + xavfsiz(el.tags['name:uz'] || el.tags.name) + '</b>');
  chiziq.addTo(guruh);
  if (!katta && el.tags.name) indeksgaQosh({tur:'yol', k:chiziq.getLatLngs(), tg:el.tags});
}

async function asosiyYukla(){
  const b = bboxMatn(CHEGARA.getSouth(), CHEGARA.getWest(), CHEGARA.getNorth(), CHEGARA.getEast());
  const sorov = `[out:json][timeout:120];
(
  way["highway"~"^(motorway|trunk|primary|secondary|tertiary)(_link)?$"]${b};
  way["waterway"~"^(river|canal|stream|ditch|drain)$"]${b};
  way["natural"="water"]${b};
  relation["natural"="water"]${b};
  way["landuse"~"^(reservoir|basin)$"]${b};
  way["leisure"~"^(park|garden|stadium|pitch|playground)$"]${b};
  relation["leisure"="park"]${b};
  way["landuse"~"^(grass|forest|recreation_ground|cemetery|orchard|vineyard|farmland|allotments)$"]${b};
  way["natural"~"^(wood|scrub)$"]${b};
  way["amenity"="grave_yard"]${b};
  way["railway"~"^(rail|tram)$"]${b};
);
out geom qt;`;
  try{
    const els = await overpass(sorov);
    for (const el of els){
      const tg = el.tags || {};
      if (tg.highway){ yolChiz(el, qatlam.yol); continue; }
      if (tg.railway){
        const k = nuqtalar(el);
        L.polyline(k, {renderer:chizgich, pane:'yol', color:'#8C8C8C', weight:2.5, interactive:false}).addTo(qatlam.temir);
        L.polyline(k, {renderer:chizgich, pane:'yol', color:'#0E1621', weight:1.2, dashArray:'6 6', interactive:false}).addTo(qatlam.temir);
        continue;
      }
      if (tg.waterway){
        const w = {river:5, canal:3, stream:1.5}[tg.waterway] || 1;
        L.polyline(nuqtalar(el), {renderer:chizgich, pane:'suv', color:'#1F6FB2',
          weight:w, opacity:0.9, interactive:false}).addTo(qatlam.suv);
        continue;
      }
      const suvmi = tg.natural === 'water' || tg.landuse === 'reservoir' || tg.landuse === 'basin';
      const qabr = tg.landuse === 'cemetery' || tg.amenity === 'grave_yard';
      const dala = ['farmland','orchard','vineyard','allotments'].includes(tg.landuse);
      for (const k of shakl(el)){
        if ((Array.isArray(k[0][0]) ? k[0] : k).length < 3) continue;
        L.polygon(k, suvmi
          ? {renderer:chizgich, pane:'suv', color:'#1F6FB2', weight:1, fillColor:'#17466F', fillOpacity:0.9, interactive:false}
          : {renderer:chizgich, pane:'yer', stroke:false, interactive:false, fillOpacity:0.75,
             fillColor: qabr ? '#2B3A30' : dala ? '#1D3524' : '#1E4D2B'}
        ).addTo(suvmi ? qatlam.suv : qatlam.yer);
      }
    }
  }catch(e){
    console.warn('Asosiy qatlam yuklanmadi', e);
    fonYoq(true);
  }
  asosiyTayyor = true;
  holatniYangila();
}

// ---------------- 3. Uylar va barcha ko'chalar — butun shahar, kataklab ----------------
// Katak ichidagi binolar bosilganda topish uchun oddiy fazoviy indeks
const indeks = new Map();                 // kalit -> [{tur, k, tg, ch}]
function katakKaliti(lat, lng){ return Math.floor(lat/KATAK) + ':' + Math.floor(lng/KATAK); }
function indeksgaQosh(ob){
  const tashqi = Array.isArray(ob.k[0][0]) ? ob.k[0] : ob.k;    // teshikli bo'lsa tashqi halqa
  const c = L.latLngBounds(tashqi).getCenter();
  const kalit = katakKaliti(c.lat, c.lng);
  if (!indeks.has(kalit)) indeks.set(kalit, []);
  indeks.get(kalit).push(ob);
}

let barchaKatak = [];
const kutilmoqda = new Set();
const yuklangan = new Set();
const urinish = new Map();

function katakChegarasi(kalit){
  const [y,x] = kalit.split(':').map(Number);
  return L.latLngBounds([y*KATAK, x*KATAK], [(y+1)*KATAK, (x+1)*KATAK]);
}
function katakShahardami(kalit){
  const b = katakChegarasi(kalit);
  if (!b.intersects(CHEGARA)) return false;
  if (!chegaraHalqa) return true;
  const nuq = [b.getCenter(), b.getNorthWest(), b.getNorthEast(), b.getSouthWest(), b.getSouthEast()];
  if (nuq.some(p => chegaradami([p.lat, p.lng]))) return true;
  return chegaraHalqa.some(h => h.some(n => b.contains(n)));   // chegara chizig'i katakdan o'tadi
}
function katakRejasi(){
  const ro = [];
  for (let y = Math.floor(CHEGARA.getSouth()/KATAK); y <= Math.floor(CHEGARA.getNorth()/KATAK); y++)
    for (let x = Math.floor(CHEGARA.getWest()/KATAK); x <= Math.floor(CHEGARA.getEast()/KATAK); x++){
      const k = y + ':' + x;
      if (katakShahardami(k)) ro.push(k);
    }
  barchaKatak = ro;
  ro.forEach(k => kutilmoqda.add(k));
}
function masofa(kalit, m){
  const c = katakChegarasi(kalit).getCenter();
  return Math.hypot(c.lat - m.lat, c.lng - m.lng);
}
// Avval ekrandagi kataklar, keyin markazga eng yaqini
function keyingiKatak(){
  if (!kutilmoqda.size) return null;
  const m = xrt.getCenter(), ekran = xrt.getBounds();
  let eng = null, engBall = Infinity;
  for (const k of kutilmoqda){
    const ball = masofa(k, m) + (katakChegarasi(k).intersects(ekran) ? 0 : 100);
    if (ball < engBall){ eng = k; engBall = ball; }
  }
  kutilmoqda.delete(eng);
  return eng;
}

async function katakYukla(kalit, server){
  const b0 = katakChegarasi(kalit);
  const b = bboxMatn(b0.getSouth().toFixed(4), b0.getWest().toFixed(4), b0.getNorth().toFixed(4), b0.getEast().toFixed(4));
  // way markazi shu katakda bo'lganlari chiziladi — qo'shni kataklar bilan takrorlanmasin
  const sorov = `[out:json][timeout:90];
(
  way["building"]${b};
  relation["building"]${b};
  way["highway"~"^(residential|unclassified|living_street|service|road|pedestrian|track|footway|path|cycleway|steps|bridleway)$"]${b};
);
out geom qt;`;
  const els = await overpass(sorov, server);
  for (const el of els){
    const tg = el.tags || {};
    const hamma = el.type === 'relation'
      ? (el.members || []).flatMap(m => m.geometry || [])
      : (el.geometry || []);
    if (!hamma.length) continue;
    const bosh = hamma[0];
    if (katakKaliti(bosh.lat, bosh.lon) !== kalit) continue;   // boshqa katakka tegishli
    if (tg.highway){ yolChiz(el, qatlam.mayda); continue; }
    for (const k of shakl(el)){
      if ((Array.isArray(k[0][0]) ? k[0] : k).length < 3) continue;
      L.polygon(k, Object.assign({renderer:chizgich, pane:'bino', weight:0.5, interactive:false}, binoUslubi(tg)))
        .addTo(qatlam.bino);
      indeksgaQosh({tur:'bino', k, tg});
    }
  }
}

async function ishchi(raqam){
  for (;;){
    const kalit = keyingiKatak();
    if (!kalit) break;
    try{
      await katakYukla(kalit, raqam);
      yuklangan.add(kalit);
    }catch(e){
      const n = (urinish.get(kalit) || 0) + 1;
      urinish.set(kalit, n);
      console.warn('Katak yuklanmadi', kalit, n, e);
      if (n < 4){
        await new Promise(r => setTimeout(r, 3000 * n));
        kutilmoqda.add(kalit);
      }else{
        yuklangan.add(kalit);           // tashlab ketamiz, foiz 100 ga yetsin
      }
    }
    holatniYangila();
  }
  holatniYangila();
}

function uylarniKorsat(){
  const yaqin = xrt.getZoom() >= UY_ZOOM;
  [qatlam.mayda, qatlam.bino].forEach(q => yaqin ? q.addTo(xrt) : xrt.removeLayer(q));
  holatniYangila();
}
function yolQalinligi(){
  const i = zoomIndeks(xrt.getZoom());
  [qatlam.yol, qatlam.mayda].forEach(g => g.eachLayer(l => {
    if (l._yolTuri) l.setStyle({weight: yolUslubi(l._yolTuri).w[i]});
  }));
}

// Bosilgan joydagi uy yoki ko'chani topish
function nuqtaChiziqdan(p, a, b){
  const dx = b.lng - a.lng, dy = b.lat - a.lat;
  const t = Math.max(0, Math.min(1, ((p.lng - a.lng)*dx + (p.lat - a.lat)*dy) / (dx*dx + dy*dy || 1)));
  return Math.hypot(p.lng - (a.lng + t*dx), p.lat - (a.lat + t*dy));
}
xrt.on('click', e => {
  if (xrt.getZoom() < 16) return;
  const p = e.latlng;
  const [y,x] = katakKaliti(p.lat, p.lng).split(':').map(Number);
  let topildi = null, engYol = null, engM = 4 * 360 / (256 * Math.pow(2, xrt.getZoom()));  // ~4px
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    for (const ob of indeks.get((y+dy) + ':' + (x+dx)) || []){
      if (ob.tur === 'bino'){
        const tashqi = Array.isArray(ob.k[0][0]) ? ob.k[0] : ob.k;
        if (!topildi && ichidami([p.lat, p.lng], tashqi)) topildi = ob;
      }else{
        for (let i = 1; i < ob.k.length; i++){
          const m = nuqtaChiziqdan(p, ob.k[i-1], ob.k[i]);
          if (m < engM){ engM = m; engYol = ob; }
        }
      }
    }
  }
  let html = '';
  if (topildi){
    const tg = topildi.tg;
    const nom = tg['name:uz'] || tg.name;
    const manzil = [tg['addr:street'], tg['addr:housenumber']].filter(Boolean).join(', ');
    const qavat = tg['building:levels'];
    html = '<b>' + xavfsiz(nom || (tarixiymi(tg) ? 'Tarixiy bino' : 'Bino')) + '</b>' +
      (manzil ? '<br>' + xavfsiz(manzil) : '') +
      (qavat ? '<br>' + xavfsiz(qavat) + ' qavat' : '');
  }else if (engYol){
    html = '<b>' + xavfsiz(engYol.tg['name:uz'] || engYol.tg.name) + '</b>';
  }
  if (html) L.popup().setLatLng(p).setContent(html).openOn(xrt);
});

// ---------------- Belgilar ----------------
const joylarEl = document.getElementById('joylar');
JOYLAR.forEach(j => {
  L.marker(j.k, {
    icon: L.divIcon({className:'belgi-yorliq', html:'<div><span></span>' + xavfsiz(j.nom) + '</div>', iconSize:[0,0]})
  }).bindPopup('<b>' + xavfsiz(j.nom) + '</b><br>' + xavfsiz(j.t)).addTo(qatlam.belgi);

  const t = document.createElement('button');
  t.className = 'joy'; t.textContent = j.nom;
  t.onclick = () => xrt.flyTo(j.k, j.z, {duration:1.2});
  joylarEl.appendChild(t);
});

// ---------------- Tugmalar ----------------
const fonTugma = document.getElementById('t-fon');
function fonYoq(yoq){
  if (yoq){ fonTayl.addTo(xrt); fonTugma.classList.add('faol'); }
  else    { xrt.removeLayer(fonTayl); fonTugma.classList.remove('faol'); }
}
fonTugma.onclick = () => fonYoq(!xrt.hasLayer(fonTayl));

document.getElementById('t-shahar').onclick = () => xrt.flyToBounds(CHEGARA, {duration:1});

let menBelgi = null;
document.getElementById('t-men').onclick = () => {
  if (!navigator.geolocation){ holat('Geolokatsiya qo\'llab-quvvatlanmaydi'); return; }
  holat('Joylashuv aniqlanmoqda…', true);
  navigator.geolocation.getCurrentPosition(p => {
    const k = [p.coords.latitude, p.coords.longitude];
    if (menBelgi) menBelgi.setLatLng(k);
    else menBelgi = L.circleMarker(k, {radius:8, color:'#fff', weight:3, fillColor:'#2FA84F', fillOpacity:1}).addTo(xrt);
    if (CHEGARA.pad(0.4).contains(k)){ xrt.flyTo(k, 17); holatniYangila(); }
    else holat('Siz Samarqanddan tashqaridasiz');
  }, () => holat('Joylashuv aniqlanmadi'), {enableHighAccuracy:true, timeout:10000});
};

// Telegram WebApp ichida ochilsa — to'liq ekran
try{ window.Telegram && Telegram.WebApp && Telegram.WebApp.expand(); }catch(e){}

xrt.on('zoomend', () => { yolQalinligi(); uylarniKorsat(); });

// ---------------- Ishga tushirish ----------------
(async function(){
  holatniYangila();
  uylarniKorsat();
  await chegaraYukla();
  katakRejasi();
  holatniYangila();
  asosiyYukla();
  for (let i = 0; i < ISHCHI; i++) ishchi(i);
})();
})();
</script>
