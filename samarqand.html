<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Samarqand 2D xaritasi</title>
<!--
  Samarqand shahrining 2D modeli.
  Ma'lumot oldindan tayyorlangan (tools/samarqand_tayyorla.py) va samarqand/
  papkasida turadi: shahar chegarasi, 87 mingdan ortiq uy (OpenStreetMap +
  Microsoft sun'iy yo'ldosh ma'lumoti), barcha ko'chalar, suv va yerlar.
  Hammasi o'zimizning kanvas qatlamimizda (L.GridLayer) chiziladi.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="samarqand/malumot.js"></script>
<style>
  :root{
    --fon:#0E1621; --panel:#17212B; --panel2:#1F2C38;
    --matn:#EDF2F7; --xira:#7D8B99; --sariq:#F2B705;
    --yashil:#2FA84F; --qizil:#E0453A; --chegara:#26333F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    background:var(--fon);color:var(--matn);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}

  #xarita{position:absolute;inset:0;background:var(--fon)}
  .leaflet-container{background:#0A1018}
  .leaflet-control-attribution{
    background:rgba(14,22,33,.75)!important;color:var(--xira)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--xira)!important}

  #sarlavha{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;
    z-index:500;display:flex;align-items:center;gap:8px;pointer-events:none}
  #sarlavha .quti{pointer-events:auto;background:rgba(23,33,43,.92);border:1px solid var(--chegara);
    border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
  #nom{font-weight:700;font-size:15px}
  #nom small{display:block;font-weight:400;font-size:11px;color:var(--xira);margin-top:2px}
  #holat{margin-left:auto;font-size:12px;color:var(--xira);white-space:nowrap}
  #holat.yuklanmoqda::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;
    border-radius:50%;background:var(--sariq);animation:puls 1s infinite}
  @keyframes puls{50%{opacity:.25}}

  #tugmalar{position:absolute;right:10px;bottom:calc(170px + env(safe-area-inset-bottom));
    z-index:500;display:flex;flex-direction:column;gap:8px}
  .yumaloq{width:44px;height:44px;border-radius:12px;border:1px solid var(--chegara);
    background:rgba(23,33,43,.95);color:var(--matn);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-decoration:none}
  .yumaloq.faol{background:var(--sariq);color:#111;border-color:var(--sariq)}
  .yumaloq.matnli{font-size:12px;font-weight:700}

  #pastki{position:absolute;left:0;right:0;bottom:0;z-index:500;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(14,22,33,.97) 60%,rgba(14,22,33,0))}
  #joylar{display:flex;gap:8px;overflow-x:auto;padding:0 10px 4px;scrollbar-width:none}
  #joylar::-webkit-scrollbar{display:none}
  .joy{flex:0 0 auto;background:var(--panel2);border:1px solid var(--chegara);color:var(--matn);
    border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .joy:active{background:var(--sariq);color:#111}
  .izoh{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px 12px 0;font-size:11px;color:var(--xira)}
  .izoh i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .izoh[hidden]{display:none}

  .belgi-yorliq{background:transparent;border:0}
  .belgi-yorliq div{transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;
    white-space:nowrap;font-size:12px;font-weight:600;color:var(--sariq);
    text-shadow:0 0 3px #000,0 0 6px #000}
  .belgi-yorliq span{width:10px;height:10px;border-radius:50%;background:var(--sariq);
    box-shadow:0 0 0 3px rgba(242,183,5,.3);flex:0 0 auto}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--matn)}
  .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.45}
  .leaflet-popup-content b{color:var(--sariq)}
  .leaflet-popup-content .xira{color:var(--xira);font-size:11px}
</style>
</head>
<body>
<div id="xarita"></div>

<div id="sarlavha">
  <div class="quti" id="nom">Samarqand <small>2D shahar modeli</small></div>
  <div class="quti yuklanmoqda" id="holat">Ma'lumot yuklanmoqda…</div>
</div>

<div id="tugmalar">
  <a class="yumaloq matnli" id="t-3d" href="samarqand3d.html" title="3D rejim">3D</a>
  <button class="yumaloq" id="t-aniqlik" title="Aniqlik rejimi: uy balandligi qayerdan olingan">📐</button>
  <button class="yumaloq" id="t-men" title="Mening joylashuvim">◎</button>
  <button class="yumaloq" id="t-shahar" title="Butun shahar">⌂</button>
</div>

<div id="pastki">
  <div id="joylar"></div>
  <div class="izoh" id="izoh-oddiy">
    <span><i style="background:#F2B705"></i>Tarixiy obida</span>
    <span><i style="background:#3E4E60"></i>Uy</span>
    <span><i style="background:#C9D3DD;height:3px"></i>Katta yo'l</span>
    <span><i style="background:#9C8660;height:2px"></i>Piyoda yo'lak</span>
    <span><i style="background:#1F6FB2"></i>Suv</span>
    <span><i style="background:#1E4D2B"></i>Bog'</span>
    <span><i style="border:1.5px dashed #F2B705;height:9px"></i>Shahar chegarasi</span>
  </div>
  <div class="izoh" id="izoh-aniqlik" hidden>
    <span><i style="background:#2FA84F"></i>Balandlik o'lchangan</span>
    <span><i style="background:#F2B705"></i>Qavatlar soni ma'lum</span>
    <span><i style="background:#56606B"></i>Balandlik taxminiy</span>
    <span><i style="border:1.5px solid #C07BFF;height:9px"></i>Sun'iy yo'ldoshdan (Microsoft)</span>
  </div>
</div>

<script>
(function(){
'use strict';
const SM = window.SamarqandMalumot;

const MARKAZ = [39.6547, 66.9757];                 // Registon
const JOYLAR = [
  { nom:"Registon",               k:[39.6547, 66.9757], z:17, t:"XV–XVII asr. Ulug'bek, Sherdor va Tillakori madrasalari." },
  { nom:"Go'ri Amir",             k:[39.6484, 66.9691], z:18, t:"Amir Temur maqbarasi, XV asr boshlari." },
  { nom:"Bibixonim masjidi",      k:[39.6607, 66.9797], z:17, t:"Amir Temur qurdirgan jome masjidi, 1399–1404." },
  { nom:"Siyob bozori",           k:[39.6617, 66.9812], z:17, t:"Shaharning eng qadimiy va katta bozori." },
  { nom:"Hazrati Xizr masjidi",   k:[39.6621, 66.9860], z:18, t:"Afrosiyob tepaligi yonidagi masjid." },
  { nom:"Shohi Zinda",            k:[39.6632, 66.9881], z:17, t:"XI–XIX asrlarga oid maqbaralar majmuasi." },
  { nom:"Afrosiyob",              k:[39.6690, 66.9930], z:16, t:"Qadimiy Samarqand shahri xarobalari va muzeyi." },
  { nom:"Ulug'bek rasadxonasi",   k:[39.6747, 67.0058], z:17, t:"Mirzo Ulug'bek rasadxonasi, 1420-yillar." },
  { nom:"Aeroport",               k:[39.7005, 66.9837], z:15, t:"Samarqand xalqaro aeroporti." }
];

// ---------------- Uslublar ----------------
// kenglik metrda (real kenglikka yaqin), min — piksel
const YOL = {
  motorway:{c:'#F2B705',m:16,min:2.5}, trunk:{c:'#F2B705',m:14,min:2.2},
  primary:{c:'#E8C766',m:12,min:2},    secondary:{c:'#C9D3DD',m:10,min:1.6},
  tertiary:{c:'#A7B3BF',m:8,min:1.2},  unclassified:{c:'#7A8A9A',m:6,min:0.8},
  residential:{c:'#6B7B8B',m:6,min:0.7}, living_street:{c:'#5F6E7C',m:5,min:0.6},
  service:{c:'#4E5B68',m:4,min:0.4},   unknown:{c:'#4E5B68',m:4,min:0.4},
  pedestrian:{c:'#8A6F3A',m:6,min:0.8},
  footway:{c:'#9C8660',m:2,min:0.5,d:[3,3],z:14}, path:{c:'#9C8660',m:1.5,min:0.5,d:[3,3],z:14},
  steps:{c:'#C47A3E',m:2,min:0.8,d:[1,2],z:15},    cycleway:{c:'#3E8FC4',m:2,min:0.5,d:[4,3],z:14},
  track:{c:'#6E5A3A',m:3,min:0.5,d:[5,4],z:14},    bridleway:{c:'#6E5A3A',m:2,min:0.5,d:[3,3],z:14},
  rail:{c:'#8C8C8C',m:3,min:1.4,temir:1}, tram:{c:'#8C6C8C',m:2,min:1,temir:1}
};
const YOL_TARTIB = ['track','bridleway','path','footway','steps','cycleway','service','unknown','living_street',
  'pedestrian','residential','unclassified','tertiary','secondary','primary','trunk','motorway','tram','rail'];
const KATTA = new Set(['motorway','trunk','primary','secondary','tertiary']);

const YER_RANG = {
  park:'#1E4D2B', grass:'#1C4428', garden:'#1E4D2B', cemetery:'#2B3A30', farmland:'#1D3524',
  orchard:'#1F3F26', pitch:'#23553A', stadium:'#23483A', playground:'#23483A', forest:'#173F24',
  school:'#1A2530', kindergarten:'#1A2530', college:'#1A2530', university:'#1A2530',
  hospital:'#2A1E24', industrial:'#1C1E26', military:'#1E211C'
};

function binoRangi(b, aniqlikRejimi){
  if (aniqlikRejimi){
    const a = b.h ? 2 : b.f ? 1 : 0;
    return a === 2 ? ['#2FA84F','#1F7A38'] : a === 1 ? ['#F2B705','#B8870A'] : ['#56606B','#3C444C'];
  }
  if (b.t) return ['#F2B705','#B8870A'];
  const s = b.s;
  if (s === 'apartments' || s === 'dormitory')                        return ['#40536A','#2E3C4B'];
  if (['commercial','retail','office','industrial','warehouse','supermarket','service','hotel'].includes(s))
                                                                      return ['#4F4A62','#34404D'];
  if (['school','university','college','kindergarten','hospital','public','civic','education','medical','library'].includes(s))
                                                                      return ['#3C6070','#2E4450'];
  if (['garage','shed','roof','carport','barn','greenhouse','outbuilding','parking'].includes(s))
                                                                      return ['#2F3A46','#252F39'];
  return ['#3E4E60','#2A3642'];
}

const SINF_NOM = {
  house:'Turar joy uyi', residential:'Turar joy', apartments:"Ko'p qavatli uy", detached:'Hovli uy',
  semidetached_house:'Juft uy', terrace:'Qator uylar', dormitory:'Yotoqxona',
  school:'Maktab', college:'Kollej', university:'Universitet', kindergarten:"Bog'cha", education:"Ta'lim",
  hospital:'Shifoxona', medical:'Tibbiyot', mosque:'Masjid', church:'Cherkov', cathedral:'Sobor',
  synagogue:'Sinagoga', religious:'Diniy bino', commercial:'Tijorat', retail:"Do'kon", supermarket:'Supermarket',
  office:'Idora', hotel:'Mehmonxona', industrial:'Sanoat', warehouse:'Ombor', garage:'Garaj', roof:'Ayvon/tom',
  civic:'Jamoat binosi', public:'Jamoat binosi', library:'Kutubxona', train_station:'Vokzal',
  post_office:'Pochta', fire_station:"O't o'chirish", stadium:'Stadion', greenhouse:'Issiqxona'
};

// ---------------- Xarita ----------------
const xrt = L.map('xarita', {
  zoomControl:false, minZoom:11, maxZoom:20, attributionControl:true
}).setView(MARKAZ, 15);
xrt.attributionControl.setPrefix(false);

const holatEl = document.getElementById('holat');
function holat(m, yuk){ holatEl.textContent = m; holatEl.classList.toggle('yuklanmoqda', !!yuk); }

// ---------------- Web Mercator ----------------
const R2D = Math.PI / 180;
function mx(lon, s){ return (lon + 180) / 360 * s; }
function my(lat, s){ const r = lat * R2D; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * s; }

// ---------------- Kanvas qatlami ----------------
let D = null;                       // yuklangan ma'lumot
let kUy, kYol, kYer, kSuv;          // fazoviy indekslar
let aniqlik = false;

const ShaharQatlam = L.GridLayer.extend({
  createTile(c){
    const t = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const o = this.getTileSize();
    t.width = o.x * dpr; t.height = o.y * dpr;
    if (D) chiz(t.getContext('2d'), c, o.x, dpr);
    return t;
  }
});

function chiz(ctx, c, T, dpr){
  const z = c.z, S = T * Math.pow(2, z);
  const ox = c.x * T, oy = c.y * T;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const X = lon => mx(lon, S) - ox, Y = lat => my(lat, S) - oy;

  // tayl qutisi (lon/lat) + zaxira (qalin chiziq va yozuvlar uchun)
  const zax = 40 / S * 360;
  const lonA = ox / S * 360 - 180 - zax, lonB = (ox + T) / S * 360 - 180 + zax;
  const latB = Math.atan(Math.sinh(Math.PI * (1 - 2 * oy / S))) / R2D + zax;
  const latA = Math.atan(Math.sinh(Math.PI * (1 - 2 * (oy + T) / S))) / R2D - zax;
  const mpp = 156543.034 * Math.cos(39.66 * R2D) / Math.pow(2, z);   // metr / piksel

  function yol(k){
    ctx.moveTo(X(k[0]), Y(k[1]));
    for (let i = 2; i < k.length; i += 2) ctx.lineTo(X(k[i]), Y(k[i+1]));
  }
  function halqa(h){ yol(h); ctx.closePath(); }

  // 1. Yer
  for (const e of kYer.izla(lonA, latA, lonB, latB)){
    const r = YER_RANG[e.s] || YER_RANG[e.tur];
    if (!r) continue;
    ctx.beginPath(); e.r.forEach(halqa);
    ctx.fillStyle = r; ctx.fill('evenodd');
  }
  // 2. Suv
  ctx.fillStyle = '#17466F';
  for (const s of kSuv.izla(lonA, latA, lonB, latB)){
    if (s.r){ ctx.beginPath(); s.r.forEach(halqa); ctx.fill('evenodd'); }
    else {
      const w = {river:14, canal:6, stream:3, drain:2, ditch:1.5}[s.s] || 2;
      ctx.beginPath(); yol(s.k);
      ctx.strokeStyle = '#1F6FB2'; ctx.lineWidth = Math.max(w / mpp, 0.8);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    }
  }
  // 3. Yo'llar — sinf bo'yicha tartibda (kattasi ustida)
  const yollar = kYol.izla(lonA, latA, lonB, latB);
  const guruh = new Map();
  for (const y of yollar){
    const u = YOL[y.s] || YOL.unknown;
    if (u.z && z < u.z) continue;
    if (!KATTA.has(y.s) && !u.temir && z < 13 && y.s !== 'unclassified') continue;
    let g = guruh.get(y.s); if (!g) guruh.set(y.s, g = []);
    g.push(y);
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // katta yo'llar uchun qora hoshiya
  if (z >= 15){
    for (const s of YOL_TARTIB){
      const g = guruh.get(s); if (!g || !KATTA.has(s)) continue;
      const u = YOL[s];
      ctx.beginPath(); g.forEach(y => yol(y.k));
      ctx.strokeStyle = '#05080C'; ctx.lineWidth = Math.max(u.m / mpp, u.min) + 2; ctx.setLineDash([]); ctx.stroke();
    }
  }
  for (const s of YOL_TARTIB){
    const g = guruh.get(s); if (!g) continue;
    const u = YOL[s];
    const w = Math.max(u.m / mpp, u.min);
    ctx.beginPath(); g.forEach(y => yol(y.k));
    ctx.strokeStyle = u.c; ctx.lineWidth = w;
    ctx.setLineDash(u.d && !u.temir ? u.d.map(v => v * Math.max(1, w / 2)) : []);
    ctx.lineCap = u.d ? 'butt' : 'round';
    ctx.stroke();
    if (u.temir){                                   // temir yo'l: kul rang ustida punktir
      ctx.strokeStyle = '#0E1621'; ctx.lineWidth = w * 0.45; ctx.setLineDash([6, 6]); ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  // 4. Uylar
  if (z >= 13){
    const uylar = kUy.izla(lonA, latA, lonB, latB);
    const chiziqQalin = z >= 17 ? 0.8 : 0.5;
    // rang bo'yicha guruhlab chizish — tezroq
    const rg = new Map();
    for (const b of uylar){
      const [f, s] = binoRangi(b, aniqlik);
      const k = f + s + (aniqlik && b.m === 1 ? 'm' : '');
      let g = rg.get(k); if (!g) rg.set(k, g = {f, s, ms: aniqlik && b.m === 1, r:[]});
      g.r.push(b);
    }
    for (const g of rg.values()){
      ctx.beginPath(); g.r.forEach(b => b.r.forEach(halqa));
      ctx.fillStyle = g.f; ctx.fill('evenodd');
      if (z >= 15 || g.ms){
        ctx.strokeStyle = g.ms ? '#C07BFF' : g.s; ctx.lineWidth = g.ms ? Math.max(chiziqQalin, 1) : chiziqQalin;
        ctx.stroke();
      }
    }
  }

  // 5. Ko'cha nomlari
  if (z >= 16){
    ctx.font = (z >= 18 ? '600 12px ' : '600 11px ') + '-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,8,12,.9)'; ctx.fillStyle = '#DDE5EC';
    for (const y of yollar){
      if (!y.nom || YOL[y.s]?.temir) continue;
      const k = y.k;
      // eng uzun bo'lak o'rtasiga yozamiz
      let eng = -1, ei = 0;
      for (let i = 2; i < k.length; i += 2){
        const d = Math.hypot(X(k[i]) - X(k[i-2]), Y(k[i+1]) - Y(k[i-1]));
        if (d > eng){ eng = d; ei = i; }
      }
      const en = ctx.measureText(y.nom).width;
      if (eng < en + 16) continue;
      const x1 = X(k[ei-2]), y1 = Y(k[ei-1]), x2 = X(k[ei]), y2 = Y(k[ei+1]);
      let bur = Math.atan2(y2 - y1, x2 - x1);
      if (bur > Math.PI/2) bur -= Math.PI; else if (bur < -Math.PI/2) bur += Math.PI;
      ctx.save();
      ctx.translate((x1 + x2) / 2, (y1 + y2) / 2); ctx.rotate(bur);
      ctx.strokeText(y.nom, 0, 0); ctx.fillText(y.nom, 0, 0);
      ctx.restore();
    }
  }

  // 6. Chegaradan tashqarini qoraytirish va chegara chizig'i
  ctx.beginPath();
  ctx.rect(-2, -2, T + 4, T + 4);
  D.chegara.forEach(p => p.forEach(halqa));
  ctx.fillStyle = 'rgba(5,8,12,.6)'; ctx.fill('evenodd');
  ctx.beginPath(); D.chegara.forEach(p => halqa(p[0]));
  ctx.strokeStyle = 'rgba(242,183,5,.18)'; ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = '#F2B705'; ctx.lineWidth = 1.6; ctx.setLineDash([8, 5]); ctx.stroke();
  ctx.setLineDash([]);
}

const qatlam = new ShaharQatlam({ tileSize:256, updateWhenZooming:false, keepBuffer:3, maxZoom:20 });

// ---------------- Bosilganda ma'lumot ----------------
function xavfsiz(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function maydon(b){                                        // m², tashqi halqa
  const h = b.r[0], k = Math.cos(39.66 * R2D) * 111320, q = 110540;
  let s = 0;
  for (let i = 0, j = h.length - 2; i < h.length; j = i, i += 2)
    s += (h[j] * k) * (h[i+1] * q) - (h[i] * k) * (h[j+1] * q);
  return Math.abs(s / 2);
}
function nuqtaChiziqdan(px, py, k, kx){
  let eng = Infinity;
  for (let i = 2; i < k.length; i += 2){
    const ax = k[i-2]*kx, ay = k[i-1], bx = k[i]*kx, by = k[i+1];
    const dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((px - ax)*dx + (py - ay)*dy) / (dx*dx + dy*dy || 1)));
    eng = Math.min(eng, Math.hypot(px - ax - t*dx, py - ay - t*dy));
  }
  return eng;
}
xrt.on('click', e => {
  if (!D || xrt.getZoom() < 15) return;
  const lon = e.latlng.lng, lat = e.latlng.lat, d = 0.0002;
  const uy = kUy.izla(lon - d, lat - d, lon + d, lat + d)
    .find(b => SM.ichidami(lon, lat, b.r[0]) && !b.r.slice(1).some(h => SM.ichidami(lon, lat, h)));
  let html = '';
  if (uy){
    const m2 = maydon(uy), bal = SM.balandlik(uy, m2);
    const qavat = uy.f || Math.max(1, Math.round((bal.m - 0.8) / SM.QAVAT_M));
    html = '<b>' + xavfsiz(uy.nom || SINF_NOM[uy.s] || 'Bino') + '</b>' +
      (uy.nom && SINF_NOM[uy.s] ? '<br>' + SINF_NOM[uy.s] : '') +
      '<br>Maydoni: ' + Math.round(m2) + ' m²' +
      '<br>Balandligi: ' + bal.m.toFixed(1) + ' m, ' + qavat + ' qavat' +
      '<br><span class="xira">' + ['o\'lchangan', 'qavatlar sonidan', 'taxminiy — aniqlashtirish kerak'][2 - bal.aniq] +
      ' · manba: ' + (uy.m === 0 ? 'OpenStreetMap' : uy.m === 1 ? 'Microsoft (sun\'iy yo\'ldosh)' : 'boshqa') + '</span>';
  } else {
    const kx = Math.cos(lat * R2D), chegara = 12 * 360 / (256 * Math.pow(2, xrt.getZoom()));
    let eng = null, engM = chegara;
    for (const y of kYol.izla(lon - chegara, lat - chegara, lon + chegara, lat + chegara)){
      if (!y.nom) continue;
      const m = nuqtaChiziqdan(lon * kx, lat, y.k, kx);
      if (m < engM){ engM = m; eng = y; }
    }
    if (eng) html = '<b>' + xavfsiz(eng.nom) + '</b>';
  }
  if (html) L.popup().setLatLng(e.latlng).setContent(html).openOn(xrt);
});

// ---------------- Belgilar ----------------
const joylarEl = document.getElementById('joylar');
JOYLAR.forEach(j => {
  L.marker(j.k, {
    icon: L.divIcon({className:'belgi-yorliq', html:'<div><span></span>' + xavfsiz(j.nom) + '</div>', iconSize:[0,0]})
  }).bindPopup('<b>' + xavfsiz(j.nom) + '</b><br>' + xavfsiz(j.t)).addTo(xrt);
  const t = document.createElement('button');
  t.className = 'joy'; t.textContent = j.nom;
  t.onclick = () => xrt.flyTo(j.k, j.z, {duration:1.2});
  joylarEl.appendChild(t);
});

// ---------------- Tugmalar ----------------
const aniqlikTugma = document.getElementById('t-aniqlik');
aniqlikTugma.onclick = () => {
  aniqlik = !aniqlik;
  aniqlikTugma.classList.toggle('faol', aniqlik);
  document.getElementById('izoh-oddiy').hidden = aniqlik;
  document.getElementById('izoh-aniqlik').hidden = !aniqlik;
  qatlam.redraw();
};
let CHEGARA = null;
document.getElementById('t-shahar').onclick = () => CHEGARA && xrt.flyToBounds(CHEGARA, {duration:1});

let menBelgi = null;
document.getElementById('t-men').onclick = () => {
  if (!navigator.geolocation){ holat('Geolokatsiya qo\'llab-quvvatlanmaydi'); return; }
  holat('Joylashuv aniqlanmoqda…', true);
  navigator.geolocation.getCurrentPosition(p => {
    const k = [p.coords.latitude, p.coords.longitude];
    if (menBelgi) menBelgi.setLatLng(k);
    else menBelgi = L.circleMarker(k, {radius:8, color:'#fff', weight:3, fillColor:'#2FA84F', fillOpacity:1}).addTo(xrt);
    if (CHEGARA && CHEGARA.pad(0.3).contains(k)){ xrt.flyTo(k, 17); holatTayyor(); }
    else holat('Siz Samarqanddan tashqaridasiz');
  }, () => holat('Joylashuv aniqlanmadi'), {enableHighAccuracy:true, timeout:10000});
};

try{ window.Telegram && Telegram.WebApp && Telegram.WebApp.expand(); }catch(e){}

function holatTayyor(){
  const s = D.statistika;
  holat(s.jami.toLocaleString('ru-RU') + ' uy · ' + D.yollar.length.toLocaleString('ru-RU') + ' yo\'l bo\'lagi');
}

// ---------------- Yuklash ----------------
SM.yukla('samarqand/').then(d => {
  D = d;
  kUy = new SM.Katak(0.004);  d.uylar.forEach(b => kUy.qosh(b));
  kYol = new SM.Katak(0.004); d.yollar.forEach(y => kYol.qosh(y));
  kYer = new SM.Katak(0.01);  d.yer.forEach(y => kYer.qosh(y));
  kSuv = new SM.Katak(0.01);  d.suvP.forEach(s => kSuv.qosh(s)); d.suvCh.forEach(s => kSuv.qosh(s));
  CHEGARA = L.latLngBounds(d.chegaraQuti);
  xrt.setMaxBounds(CHEGARA.pad(0.4));
  xrt.attributionControl.addAttribution(xavfsiz(d.manba));
  qatlam.addTo(xrt);
  holatTayyor();
}).catch(e => {
  console.error(e);
  holat('Ma\'lumot yuklanmadi: ' + e.message);
});
})();
</script>
